<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>高校野球 選手育成シミュレーション</title>
<style>
  body {
    font-family: "Hiragino Sans", "Meiryo", sans-serif;
    background: #f2f5f0;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    color: #1a5d2b;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 16px 20px;
    max-width: 480px;
    margin: 16px auto;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
  }
  input[type="text"], select {
    width: 100%;
    padding: 6px;
    margin-top: 4px;
    box-sizing: border-box;
    font-size: 14px;
  }
  button {
    margin-top: 16px;
    padding: 10px 16px;
    background: #1a5d2b;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
  }
  button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  .calendar-line {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #1a5d2b;
  }
  .status-line {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin-top: 6px;
    min-height: 18px;
  }
  .official-match-button {
    background: #b3261e;
  }
  #official-match-result, #practice-game-result {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    color: #444;
    min-height: 18px;
  }
  .match-outcome {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .match-outcome.win { color: #1a5d2b; }
  .match-outcome.lose { color: #b3261e; }
  .opponent-line {
    font-size: 12px;
    color: #555;
    margin-bottom: 8px;
  }
  .box-score-wrap {
    overflow-x: auto;
  }
  .box-score {
    margin: 0 auto;
    border-collapse: collapse;
    font-size: 11px;
  }
  .box-score th, .box-score td {
    border: 1px solid #ccc;
    padding: 3px 6px;
    text-align: center;
  }
  .box-score th {
    background: #eef3ec;
  }
  .commentary-lines {
    margin-top: 8px;
    font-size: 12px;
    color: #444;
    text-align: left;
  }
  .match-power-line {
    margin-top: 8px;
    font-size: 12px;
    color: #777;
  }
  .player {
    border-left: 4px solid #1a5d2b;
    padding: 8px 12px;
    margin-top: 10px;
    background: #f7faf6;
    border-radius: 4px;
  }
  .player-name {
    font-weight: bold;
    font-size: 16px;
  }
  .player-pos, .player-grade {
    display: inline-block;
    font-size: 12px;
    background: #1a5d2b;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .player-grade {
    background: #666;
  }
  .talent-badge {
    display: inline-block;
    font-size: 12px;
    background: #e0a800;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .injury-badge {
    display: inline-block;
    font-size: 12px;
    background: #b3261e;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .fatigue-line {
    font-size: 12px;
    margin-top: 4px;
    font-weight: bold;
  }
  .fatigue-line.fatigue-ok { color: #1a5d2b; }
  .fatigue-line.fatigue-warn { color: #e0a800; }
  .fatigue-line.fatigue-danger { color: #b3261e; }
  .rank-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
    background: #b8860b;
    color: white;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    margin-left: 6px;
  }
  .stat-line {
    font-size: 13px;
    margin-top: 4px;
    color: #444;
  }
  .practice-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: stretch;
  }
  .practice-select {
    margin-top: 0;
    flex: 2;
  }
  .practice-execute-button {
    margin-top: 0;
    width: auto;
    flex: 1;
    padding: 6px 10px;
    font-size: 12px;
    background: #3d7dd6;
  }
  .empty-note {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-top: 10px;
  }
  .team-power-line {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: #1a5d2b;
    margin-bottom: 4px;
  }
  .bulk-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 8px;
  }
  .bulk-label {
    font-size: 12px;
    font-weight: bold;
    flex: 0 0 44px;
  }
  .bulk-select {
    margin-top: 0;
    flex: 2;
  }
  .bulk-apply-button {
    margin-top: 0;
    width: auto;
    flex: 2;
    padding: 6px 8px;
    font-size: 12px;
    background: #6a4fb3;
  }
  .scout-recruit-button {
    margin-top: 8px;
    padding: 6px 10px;
    font-size: 12px;
    background: #1a5d2b;
  }
  .lineup-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
  }
  .lineup-row label {
    flex: 0 0 36px;
    margin-top: 0;
    font-size: 12px;
    font-weight: bold;
  }
  .lineup-row select {
    margin-top: 0;
    flex: 1;
  }
  .rival-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
    border-bottom: 1px solid #eee;
  }
  .rival-row .rival-name {
    font-weight: bold;
  }
  .rival-row .rival-trait {
    color: #888;
    font-size: 11px;
    display: block;
  }
</style>
</head>
<body>

<h1>⚾ 高校野球 選手育成シミュレーション</h1>

<div style="text-align:center; max-width:480px; margin:0 auto;">
  <button id="reset-button" style="width:auto; margin-top:0; padding:6px 14px; font-size:12px; background:#b3261e;">データをリセットして最初から</button>
</div>

<div class="card">
  <div class="calendar-line" id="calendar-line"></div>
  <div class="status-line" id="status-line"></div>
  <button id="official-match-button" class="official-match-button" style="display:none;">公式戦を行う</button>
  <div id="official-match-result"></div>
  <button id="next-week-button">次の週へ</button>
  <div id="practice-game-result"></div>
</div>

<div class="card" id="scout-card" style="display:none;">
  <h2 style="font-size:16px; margin-top:0;">スカウト候補</h2>
  <div class="empty-note" style="margin-top:0;">気に入った選手を選んで入部させましょう(全員入れる必要はありません)。</div>
  <div id="scout-list"></div>
</div>

<div class="card">
  <h2 style="font-size:16px; margin-top:0;">スタメン・打順</h2>
  <div class="empty-note" style="margin-top:0;">試合はここで選んだ9人だけで戦います。出場した選手だけ試合の経験で能力が伸びます。</div>
  <label>先発投手</label>
  <select id="lineup-pitcher-select"></select>
  <div id="lineup-order-area" style="margin-top:8px;"></div>
</div>

<div class="card">
  <h2 style="font-size:16px; margin-top:0;">登録した選手</h2>
  <div id="team-power-line" class="team-power-line"></div>
  <div id="tournament-week-note" class="empty-note" style="display:none;">大会期間中のため、今週は練習できません。</div>
  <div id="bulk-practice-controls"></div>
  <div id="player-list"></div>
  <div id="empty-list-note" class="empty-note">まだ選手が登録されていません。</div>
</div>

<div class="card">
  <h2 style="font-size:16px; margin-top:0;">ライバル校との対戦成績</h2>
  <div id="rivals-list"></div>
  <div id="rivals-empty-note" class="empty-note">まだ対戦記録がありません。</div>
</div>

<script>
  const STAT_CAP = 150;
  const players = [];

  const positionLabels = {
    pitcher: "投手",
    catcher: "捕手",
    infielder: "内野手",
    outfielder: "外野手",
  };

  // 投手は専用の能力値、それ以外の守備位置(捕手・内野手・外野手)は共通の能力値を使う
  const fielderStatDefs = [
    { key: "batting", label: "打力" },
    { key: "running", label: "走力" },
    { key: "fielding", label: "守備力" },
    { key: "arm", label: "肩力" },
  ];

  const statDefs = {
    pitcher: [
      { key: "velocity", label: "球速" },
      { key: "breaking", label: "変化球" },
      { key: "control", label: "コントロール" },
      { key: "stamina", label: "スタミナ" },
    ],
    catcher: fielderStatDefs,
    infielder: fielderStatDefs,
    outfielder: fielderStatDefs,
  };

  // 練習メニュー: 能力値ごとに専用の練習を用意する。「休養」は疲労を回復する特別なメニュー
  const REST_MENU = { statKey: "rest", label: "休養" };
  const practiceMenus = {
    pitcher: [
      { statKey: "velocity", label: "投球練習" },
      { statKey: "breaking", label: "変化球練習" },
      { statKey: "control", label: "コントロール練習" },
      { statKey: "stamina", label: "走り込み" },
      REST_MENU,
    ],
    catcher: [
      { statKey: "batting", label: "バッティング練習" },
      { statKey: "running", label: "走り込み" },
      { statKey: "fielding", label: "守備練習" },
      { statKey: "arm", label: "肩力トレーニング" },
      REST_MENU,
    ],
    infielder: [
      { statKey: "batting", label: "バッティング練習" },
      { statKey: "running", label: "走り込み" },
      { statKey: "fielding", label: "守備練習" },
      { statKey: "arm", label: "肩力トレーニング" },
      REST_MENU,
    ],
    outfielder: [
      { statKey: "batting", label: "バッティング練習" },
      { statKey: "running", label: "走り込み" },
      { statKey: "fielding", label: "守備練習" },
      { statKey: "arm", label: "肩力トレーニング" },
      REST_MENU,
    ],
  };

  // 1ヶ月=4週間の簡易カレンダー。4月を0週目として48週で1年
  const WEEKS_PER_MONTH = 4;
  const monthNames = ["4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月", "1月", "2月", "3月"];
  const TOTAL_WEEKS = monthNames.length * WEEKS_PER_MONTH;

  // 公式戦の日程(週番号は0始まり)
  const tournaments = [
    { id: "spring", name: "春季大会", startWeek: 2, endWeek: 7, roundsToWin: 4 },
    { id: "summer", name: "夏の大会(地方予選)", startWeek: 12, endWeek: 15, roundsToWin: 4 },
    { id: "koshien", name: "甲子園(全国大会)", startWeek: 16, endWeek: 19, roundsToWin: 3, requiresChampion: "summer" },
    { id: "fall", name: "秋季大会", startWeek: 24, endWeek: 27, roundsToWin: 4 },
  ];
  const tournamentState = {};
  tournaments.forEach(t => {
    tournamentState[t.id] = { currentRound: 0, eliminated: false, champion: false, resetYear: 0 };
  });

  let schoolYear = 1;
  let weekIndex = 0;
  let officialMatchPlayedThisWeek = false;
  let seasonEventMessage = "";
  let scoutCandidates = [];
  let scoutIdCounter = 0;
  let playerIdCounter = 0;
  // スタメン・打順: pitcherIdが先発投手、orderが1〜8番打者(打順どおり)の選手ID配列
  let lineup = { pitcherId: null, order: [null, null, null, null, null, null, null, null] };
  const SAVE_KEY = "baseballSimSave";

  // 新入部員の自動生成に使う名前とポジションの候補
  const sampleRecruitNames = [
    "佐藤健太", "鈴木大輔", "高橋翔", "田中蓮", "伊藤陸", "渡辺樹", "山本颯太", "中村悠斗",
    "小林大和", "加藤悠", "吉田颯", "斎藤諒", "山口大翔", "松本蒼", "井上駿", "木村陽翔",
    "林拓海", "清水湊", "山崎大輝", "阿部樹", "森大地", "池田悠真", "橋本蒼太", "石川陽向",
    "前田輝", "藤田航", "岡田悠斗", "長谷川大和", "村上蓮", "近藤陽太", "坂本翼", "遠藤翔太",
  ];
  const allPositions = ["pitcher", "catcher", "infielder", "outfielder"];

  // ライバル校: 対戦相手に個性を持たせる
  const RIVAL_SCHOOLS = [
    { name: "青葉学院", trait: "強打を誇る強豪" },
    { name: "北陵高校", trait: "堅い守備が持ち味" },
    { name: "臨海工業", trait: "俊足を活かした機動力野球" },
    { name: "旭丘高校", trait: "エースの好投が光る" },
    { name: "緑ヶ丘学園", trait: "粘り強い攻撃が身上" },
    { name: "港南商業", trait: "一発長打が魅力" },
    { name: "白鷺高校", trait: "堅実なチームプレー" },
    { name: "桜台高校", trait: "勢いのある若いチーム" },
    { name: "常盤大学附属", trait: "伝統ある名門校" },
    { name: "海浜学院", trait: "波に乗ると止まらない" },
  ];
  const rivalRecords = {};

  function pickRivalSchool() {
    return RIVAL_SCHOOLS[Math.floor(Math.random() * RIVAL_SCHOOLS.length)];
  }

  function recordRivalResult(schoolName, isWin) {
    if (!rivalRecords[schoolName]) rivalRecords[schoolName] = { wins: 0, losses: 0 };
    if (isWin) rivalRecords[schoolName].wins++;
    else rivalRecords[schoolName].losses++;
  }

  // チームの強さ・選手個人の強さを数字ではなく段階で表現する
  const POWER_TIERS = [
    { max: 99, label: "弱小" },
    { max: 199, label: "普通" },
    { max: 299, label: "中堅" },
    { max: 399, label: "強豪" },
    { max: Infinity, label: "甲子園常連校" },
  ];

  function powerTierIndex(averagePower) {
    return POWER_TIERS.findIndex(tier => averagePower <= tier.max);
  }

  function powerTierLabel(averagePower) {
    return POWER_TIERS[powerTierIndex(averagePower)].label;
  }

  function currentTeamTierLabel() {
    if (players.length === 0) return "選手なし";
    return powerTierLabel(totalTeamPower() / players.length);
  }

  function playerGradeLabel(player) {
    const grade = schoolYear - player.enrollYear + 1;
    return grade >= 4 ? "卒業" : `${grade}年生`;
  }

  function playerPowerSum(player) {
    return Object.values(player.stats).reduce((s, v) => s + v, 0);
  }

  // 選手個人の能力は「弱小」のようなチーム向けの言葉ではなく、野球ゲームでおなじみのランク(G〜S)で表現する
  const PLAYER_RANKS = [
    { max: 99, label: "G" },
    { max: 149, label: "F" },
    { max: 199, label: "D" },
    { max: 249, label: "C" },
    { max: 299, label: "B" },
    { max: 349, label: "A" },
    { max: Infinity, label: "S" },
  ];

  function playerRankLabel(player) {
    const sum = playerPowerSum(player);
    return PLAYER_RANKS.find(rank => sum <= rank.max).label;
  }

  function createPlayer(name, position, enrollYear) {
    const { stats, talentLabel } = rollNewPlayerStats(position);
    playerIdCounter++;
    return {
      id: playerIdCounter,
      name,
      position,
      stats,
      talentLabel,
      enrollYear: enrollYear === undefined ? schoolYear : enrollYear,
      practicedThisWeek: false,
      selectedPracticeStatKey: practiceMenus[position][0].statKey,
      fatigue: 0,
      injuryWeeksLeft: 0,
    };
  }

  function randomRecruitName(excludeNames) {
    const activeNames = new Set([...players.map(p => p.name), ...(excludeNames || [])]);
    const available = sampleRecruitNames.filter(n => !activeNames.has(n));
    const pool = available.length > 0 ? available : sampleRecruitNames;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function randomPosition() {
    return allPositions[Math.floor(Math.random() * allPositions.length)];
  }

  // 投手が0人にならないよう、必要なら直近の選手を投手として振り直す
  function ensurePitcherExists() {
    if (players.length === 0 || players.some(p => p.position === "pitcher")) return;
    const target = players[players.length - 1];
    target.position = "pitcher";
    const { stats, talentLabel } = rollNewPlayerStats("pitcher");
    target.stats = stats;
    target.talentLabel = talentLabel;
    target.selectedPracticeStatKey = practiceMenus.pitcher[0].statKey;
  }

  // ゲーム開始時、すでに2・3年生がいるチームを引き継いだ状態からスタートする
  function generateInitialRoster() {
    // 3年生(enrollYear = schoolYear - 2)と2年生(enrollYear = schoolYear - 1)を何人か配置
    [{ grade: 3, count: 3 + Math.floor(Math.random() * 2) },
     { grade: 2, count: 3 + Math.floor(Math.random() * 2) }].forEach(({ grade, count }) => {
      const enrollYear = schoolYear - (grade - 1);
      for (let i = 0; i < count; i++) {
        const player = createPlayer(randomRecruitName(), randomPosition(), enrollYear);
        // 上級生はすでに1〜2年分練習を積んでいるぶん、能力を底上げしておく
        const yearsTrained = grade - 1;
        const defs = statDefs[player.position];
        for (let y = 0; y < yearsTrained; y++) {
          for (let k = 0; k < 3; k++) {
            const def = defs[Math.floor(Math.random() * defs.length)];
            const gain = 5 + Math.floor(Math.random() * 10);
            player.stats[def.key] = Math.min(STAT_CAP, player.stats[def.key] + gain);
          }
        }
        players.push(player);
      }
    });
  }

  // 卒業させたうえで、スカウト候補(新入部員候補)を生成する。人数はほぼ一定で、
  // 学校の強さは「人数」ではなく候補選手の「質」(能力の初期値・才能の出やすさ)に反映する
  function processGraduationAndScout() {
    // 4年目を迎えた(=3年生を終えた)選手は卒業して抜ける
    for (let i = players.length - 1; i >= 0; i--) {
      const grade = schoolYear - players[i].enrollYear + 1;
      if (grade > 3) players.splice(i, 1);
    }
    scoutCandidates = generateScoutCandidates();
  }

  function generateScoutCandidates() {
    const tierIndex = players.length > 0
      ? powerTierIndex(totalTeamPower() / players.length)
      : 0;
    const poolSize = 4 + Math.floor(Math.random() * 2); // 4〜5人の候補を提示する(全員入部させる必要はない)

    const candidates = [];
    const usedNames = [];
    for (let i = 0; i < poolSize; i++) {
      const position = randomPosition();
      const name = randomRecruitName(usedNames);
      usedNames.push(name);
      const { stats, talentLabel } = rollNewPlayerStats(position, tierIndex);
      scoutIdCounter++;
      candidates.push({ id: scoutIdCounter, name, position, stats, talentLabel });
    }

    // 投手候補が1人もいない場合、必ず1人は投手候補になるようにする
    const hasPitcherOnRoster = players.some(p => p.position === "pitcher");
    if (!hasPitcherOnRoster && !candidates.some(c => c.position === "pitcher")) {
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      target.position = "pitcher";
      const rerolled = rollNewPlayerStats("pitcher", tierIndex);
      target.stats = rerolled.stats;
      target.talentLabel = rerolled.talentLabel;
    }

    return candidates;
  }

  function recruitCandidate(id) {
    const index = scoutCandidates.findIndex(c => c.id === id);
    if (index === -1) return;
    const candidate = scoutCandidates[index];
    playerIdCounter++;
    players.push({
      id: playerIdCounter,
      name: candidate.name,
      position: candidate.position,
      stats: candidate.stats,
      talentLabel: candidate.talentLabel,
      enrollYear: schoolYear,
      practicedThisWeek: false,
      selectedPracticeStatKey: practiceMenus[candidate.position][0].statKey,
      fatigue: 0,
      injuryWeeksLeft: 0,
    });
    scoutCandidates.splice(index, 1);
    renderScoutCandidates();
    renderPlayerList();
  }

  function rollNewPlayerStats(position, tierIndex) {
    const idx = tierIndex || 0;
    const defs = statDefs[position];
    const stats = {};
    // 入学したての1年生は基本的に能力が低め。学校が強いほど、少しだけ有望な新入生が来やすくなる
    const baseMin = 15 + idx * 3;
    const baseMax = 30 + idx * 5;
    defs.forEach(def => {
      stats[def.key] = baseMin + Math.floor(Math.random() * (baseMax - baseMin + 1));
    });

    // 一定確率で「才能」が発動し、1つの能力だけ大きく伸びる(学校が強いほど才能持ちが出やすい)
    let talentLabel = null;
    const talentChance = 0.25 + idx * 0.08;
    if (Math.random() < talentChance) {
      const def = defs[Math.floor(Math.random() * defs.length)];
      const bonus = 15 + Math.floor(Math.random() * 21); // +15〜35
      stats[def.key] = Math.min(STAT_CAP, stats[def.key] + bonus);
      talentLabel = def.label;
    }

    return { stats, talentLabel };
  }

  function renderRivalRecords() {

      .sort((a, b) => (b[1].wins + b[1].losses) - (a[1].wins + a[1].losses))
      .map(([name, r]) => {

  function renderLineupControls() {
    const pitchers = players.filter(p => p.position === "pitcher" && isFitToPlay(p));
    lineupPitcherSelect.innerHTML = pitchers.length > 0
      ? pitchers.map(p => `<option value="${p.id}" ${p.id === lineup.pitcherId ? "selected" : ""}>${p.name}(${playerGradeLabel(p)}/${playerRankLabel(p)})</option>`).join("")
      : `<option value="">投手がいません</option>`;

    lineupOrderArea.innerHTML = "";
    const fielders = players.filter(p => p.position !== "pitcher" && isFitToPlay(p));

      const selectable = fielders.filter(p => !usedElsewhere.includes(p.id));

      const optionsHtml = [`<option value="">-- 空き --</option>`]

        .join("");

      row.className = "lineup-row";

  function renderScoutCandidates() {

  scoutListArea.addEventListener("click", (event) => {
    if (event.target.classList.contains("scout-recruit-button")) {

  resetButton.addEventListener("click", () => {
    if (confirm("保存されているデータを削除して最初からやり直します。よろしいですか?")) {
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }
  });

  function saveGame() {
    const state = {
      players,
      schoolYear,
      weekIndex,
      officialMatchPlayedThisWeek,
      seasonEventMessage,
      tournamentState,
      scoutCandidates,
      scoutIdCounter,
      playerIdCounter,
      lineup,
      bulkSelectionByPosition,
      rivalRecords,
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {
      // 保存に失敗しても(容量制限など)ゲーム自体は続行できるようにする
    }
  }

  function loadGame() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    try {
      const state = JSON.parse(raw);
      players.length = 0;
      players.push(...state.players);
      schoolYear = state.schoolYear;
      weekIndex = state.weekIndex;
      officialMatchPlayedThisWeek = state.officialMatchPlayedThisWeek;
      seasonEventMessage = state.seasonEventMessage || "";
      Object.keys(tournamentState).forEach(id => {
        if (state.tournamentState && state.tournamentState[id]) {
          Object.assign(tournamentState[id], state.tournamentState[id]);
        }
      });
      scoutCandidates = state.scoutCandidates || [];
      scoutIdCounter = state.scoutIdCounter || 0;
      playerIdCounter = state.playerIdCounter || 0;
      lineup = state.lineup || { pitcherId: null, order: [null, null, null, null, null, null, null, null] };
      Object.assign(bulkSelectionByPosition, state.bulkSelectionByPosition || {});
      Object.assign(rivalRecords, state.rivalRecords || {});
      return true;
    } catch (e) {
      return false;
    }
  }

  function roundLabel(roundsToWin, roundNumber) {
    const fromEnd = roundsToWin - roundNumber;
    if (fromEnd === 0) return "決勝";
    if (fromEnd === 1) return "準決勝";
    return `${roundNumber}回戦`;
  }

  function ensureTournamentReset(t) {
    const state = tournamentState[t.id];
    if (state.resetYear !== schoolYear && weekIndex >= t.startWeek) {
      state.currentRound = 0;
      state.eliminated = false;
      state.champion = false;
      state.resetYear = schoolYear;
    }
  }

  function findWindowTournament() {
    return tournaments.find(t => weekIndex >= t.startWeek && weekIndex <= t.endWeek);
  }

  function isMatchAvailable(t) {
    if (!t) return false;
    ensureTournamentReset(t);
    const state = tournamentState[t.id];
    if (state.eliminated || state.champion) return false;
    if (officialMatchPlayedThisWeek) return false;
    if (t.requiresChampion) {
      const reqState = tournamentState[t.requiresChampion];
      if (!reqState.champion || reqState.resetYear !== schoolYear) return false;
    }
    return true;
  }

  function totalTeamPower() {
    return players.reduce((sum, player) => {
      const statValues = Object.values(player.stats);
      return sum + statValues.reduce((s, v) => s + v, 0);
    }, 0);
  }

  function getStartingPlayers() {
    const ids = [lineup.pitcherId, ...lineup.order].filter(id => id !== null && id !== undefined);
    return players.filter(p => ids.includes(p.id));
  }

  // スタメンに入っている選手だけで試合の力を計算する(打順1〜5番は少し重みを大きくする)
  function totalLineupPower() {
    let sum = 0;
    const pitcher = players.find(p => p.id === lineup.pitcherId);
    if (pitcher) sum += playerPowerSum(pitcher);
    lineup.order.forEach((id, idx) => {
      if (!id) return;
      const p = players.find(pl => pl.id === id);
      if (!p) return;
      const weight = idx < 5 ? 1.15 : 1.0;
      sum += playerPowerSum(p) * weight;
    });
    return sum;
  }

  // 卒業などでいなくなった選手をスタメンから外し、空いた枠には残りで一番能力が高い選手を自動で補う
  function isFitToPlay(player) {
    return !player.injuryWeeksLeft || player.injuryWeeksLeft <= 0;
  }

  // 故障中の選手はスタメンに入れない(自動補充・既存の選出とも対象外にする)
  function autoFillLineup() {
    const pitchers = players.filter(p => p.position === "pitcher" && isFitToPlay(p));
    if (!lineup.pitcherId || !pitchers.some(p => p.id === lineup.pitcherId)) {
      const best = [...pitchers].sort((a, b) => playerPowerSum(b) - playerPowerSum(a))[0];
      lineup.pitcherId = best ? best.id : null;
    }

    lineup.order = lineup.order.map(id => {
      if (!id) return null;
      const p = players.find(pl => pl.id === id);
      return (p && isFitToPlay(p)) ? id : null;
    });
    while (lineup.order.length < 8) lineup.order.push(null);

    const usedIds = new Set([lineup.pitcherId, ...lineup.order].filter(Boolean));
    const availableSorted = players
      .filter(p => p.position !== "pitcher" && isFitToPlay(p) && !usedIds.has(p.id))
      .sort((a, b) => playerPowerSum(b) - playerPowerSum(a));

    for (let i = 0; i < 8; i++) {
      if (!lineup.order[i] && availableSorted.length > 0) {
        lineup.order[i] = availableSorted.shift().id;
      }
    }
  }

  function runMatch(roundInfo) {
    const teamPower = totalLineupPower();

    // 大会の試合は、序盤は格下寄り・勝ち進むほど格上と当たりやすくなるように相手の強さの範囲を変える
    // (roundInfoがない練習試合は、これまで通り70%〜130%の範囲)
    let low = 0.7;
    let high = 1.3;
    if (roundInfo && roundInfo.roundsToWin > 1) {
      const progress = (roundInfo.roundNumber - 1) / (roundInfo.roundsToWin - 1); // 0(1回戦)〜1(決勝)
      low = 0.5 + progress * 0.4;   // 0.5 → 0.9
      high = 0.9 + progress * 0.7;  // 0.9 → 1.6
    }
    const opponentPower = Math.round(teamPower * (low + Math.random() * (high - low)));

    // 自チームが強いほど勝ちやすいが、多少の運の要素もある
    const winProbability = teamPower / (teamPower + opponentPower);
    const isWin = Math.random() < winProbability;
    const starters = getStartingPlayers();
    const count = starters.length || 1;
    const teamTier = powerTierLabel(teamPower / count);
    const opponentTier = powerTierLabel(opponentPower / count);
    const opponentSchool = pickRivalSchool();
    recordRivalResult(opponentSchool.name, isWin);
    return { teamPower, opponentPower, isWin, teamTier, opponentTier, opponentSchool };
  }

  const INNING_COUNT = 9;

  // 勝敗の結果と矛盾しないように、9イニング分の得点経過を作る
  function generateBoxScore(isWin) {
    const teamRuns = [];
    const oppRuns = [];
    for (let i = 0; i < INNING_COUNT; i++) {
      teamRuns.push(Math.floor(Math.random() * 3)); // 0〜2点
      oppRuns.push(Math.floor(Math.random() * 3));
    }
    let teamTotal = teamRuns.reduce((a, b) => a + b, 0);
    let oppTotal = oppRuns.reduce((a, b) => a + b, 0);

    // 勝敗と合っていなければ最終回で帳尻を合わせる
    if (isWin && teamTotal <= oppTotal) {
      teamRuns[INNING_COUNT - 1] += (oppTotal - teamTotal) + 1 + Math.floor(Math.random() * 2);
    } else if (!isWin && oppTotal <= teamTotal) {
      oppRuns[INNING_COUNT - 1] += (teamTotal - oppTotal) + 1 + Math.floor(Math.random() * 2);
    }

    teamTotal = teamRuns.reduce((a, b) => a + b, 0);
    oppTotal = oppRuns.reduce((a, b) => a + b, 0);
    return { teamRuns, oppRuns, teamTotal, oppTotal };
  }

  function buildCommentary(box, isWin, opponentName) {
    const lines = [];
    const teamBestInning = box.teamRuns.indexOf(Math.max(...box.teamRuns));
    if (box.teamRuns[teamBestInning] >= 2) {
      lines.push(`${teamBestInning + 1}回、自チームが${box.teamRuns[teamBestInning]}点を奪う猛攻を見せた。`);
    }
    const oppBestInning = box.oppRuns.indexOf(Math.max(...box.oppRuns));
    if (box.oppRuns[oppBestInning] >= 2) {
      lines.push(`${oppBestInning + 1}回、${opponentName}に${box.oppRuns[oppBestInning]}点を奪われる場面もあった。`);
    }

    const diff = Math.abs(box.teamTotal - box.oppTotal);
    if (diff <= 1) {
      lines.push(isWin ? "最後まで分からない大接戦を制した!" : "僅差の勝負を落としてしまった…");
    } else if (diff >= 5) {
      lines.push(isWin ? "力の差を見せつける完勝だった。" : "力の差を見せつけられる完敗だった…");
    } else {
      lines.push(isWin ? "着実に得点を重ねて勝利した。" : "反撃及ばず敗れた。");
    }
    return lines;
  }

  function buildMatchReportHtml(label, result) {
    const box = generateBoxScore(result.isWin);
    const school = result.opponentSchool;
    const commentary = buildCommentary(box, result.isWin, school.name);
    const inningHeaders = box.teamRuns.map((_, i) => `<th>${i + 1}</th>`).join("") + "<th>計</th>";
    const teamRow = box.teamRuns.map(r => `<td>${r}</td>`).join("") + `<td><strong>${box.teamTotal}</strong></td>`;
    const oppRow = box.oppRuns.map(r => `<td>${r}</td>`).join("") + `<td><strong>${box.oppTotal}</strong></td>`;
    const outcomeText = result.isWin ? "🎉 勝利!" : "😢 敗北…";
    const record = rivalRecords[school.name] || { wins: 0, losses: 0 };

    return `
      <div class="match-outcome ${result.isWin ? "win" : "lose"}">${label}: ${outcomeText}</div>
      <div class="opponent-line">対戦校: ${school.name}(${school.trait})</div>
      <div class="box-score-wrap">
        <table class="box-score">
          <tr><th></th>${inningHeaders}</tr>
          <tr><th>自チーム</th>${teamRow}</tr>
          <tr><th>${school.name}</th>${oppRow}</tr>
        </table>
      </div>
      <div class="commentary-lines">${commentary.map(line => `<div>${line}</div>`).join("")}</div>
      <div class="match-power-line">自チーム: ${result.teamTier} / ${school.name}: ${result.opponentTier}(通算 ${record.wins}勝${record.losses}敗)</div>
    `;
  }

  // 試合を経験することで、出場した(スタメンの)選手だけ能力が少しずつ伸びる(その分、疲労も少し溜まる)
  function grantMatchExperience() {
    getStartingPlayers().forEach(player => {
      const defs = statDefs[player.position];
      const def = defs[Math.floor(Math.random() * defs.length)];
      const gain = 1 + Math.floor(Math.random() * 2); // 1〜2ポイント上がる
      player.stats[def.key] = Math.min(STAT_CAP, player.stats[def.key] + gain);
      player.fatigue = Math.min(100, (player.fatigue || 0) + 5 + Math.floor(Math.random() * 6)); // 5〜10
    });
  }

  function isMatchPendingThisWeek() {
    const windowT = findWindowTournament();
    return !!windowT && isMatchAvailable(windowT);
  }

  function renderCalendar() {
    const monthIndex = Math.floor(weekIndex / WEEKS_PER_MONTH);
    const weekInMonth = (weekIndex % WEEKS_PER_MONTH) + 1;
    calendarLine.textContent = `${schoolYear}年目 ${monthNames[monthIndex]} 第${weekInMonth}週`;

    const windowT = findWindowTournament();
    if (windowT) {
      ensureTournamentReset(windowT);
      const state = tournamentState[windowT.id];
      if (state.champion) {
        statusLine.textContent = `${windowT.name}で優勝しました!`;
      } else if (state.eliminated) {
        statusLine.textContent = `${windowT.name}で敗退しました。`;
      } else if (windowT.requiresChampion && !isMatchAvailable(windowT)) {
        statusLine.textContent = `${windowT.name}の出場権はありません。`;
      } else {
        statusLine.textContent = `${windowT.name} ${roundLabel(windowT.roundsToWin, state.currentRound + 1)}の期間です。`;
      }
    } else if (seasonEventMessage) {
      statusLine.textContent = seasonEventMessage;
    } else if (weekIndex === 0) {
      statusLine.textContent = "新学期が始まりました。";
    } else if (weekIndex === TOTAL_WEEKS - 1) {
      statusLine.textContent = "学年末です。来週から新学年になります。";
    } else {
      statusLine.textContent = "オフシーズンです。練習に励みましょう。";
    }

    if (windowT && isMatchAvailable(windowT)) {
      const state = tournamentState[windowT.id];
      officialMatchButton.style.display = "block";
      officialMatchButton.textContent = `公式戦: ${windowT.name} ${roundLabel(windowT.roundsToWin, state.currentRound + 1)}を行う`;
    } else {
      officialMatchButton.style.display = "none";
    }

    updateNextWeekButtonState();
  }

  function canAdvanceWeek() {
    // 今週の公式戦がまだ残っていれば次の週へ進めない(練習は必須にしない)
    return !isMatchPendingThisWeek();
  }

  function updateNextWeekButtonState() {
    nextWeekButton.disabled = !canAdvanceWeek();
  }

  officialMatchButton.addEventListener("click", () => {
    if (!lineup.pitcherId) {
      alert("スタメンに投手がいません。「スタメン・打順」で先発投手を選んでください。");
      return;
    }
    const windowT = findWindowTournament();
    if (!windowT || !isMatchAvailable(windowT)) return;

    const state = tournamentState[windowT.id];
    const roundNumber = state.currentRound + 1;
    const label = roundLabel(windowT.roundsToWin, roundNumber);
    const result = runMatch({ roundNumber, roundsToWin: windowT.roundsToWin });

    if (result.isWin) {
      state.currentRound++;
      if (state.currentRound >= windowT.roundsToWin) {
        state.champion = true;
      }
    } else {
      state.eliminated = true;
    }
    officialMatchPlayedThisWeek = true;
    grantMatchExperience();

    let reportLabel = `${windowT.name} ${label}`;
    if (result.isWin && state.champion) {
      reportLabel += `(優勝!)`;
    }
    officialMatchResult.innerHTML = buildMatchReportHtml(reportLabel, result);

    renderCalendar();
    renderPlayerList();
  });

  nextWeekButton.addEventListener("click", () => {
    if (!canAdvanceWeek()) return;

    // まだ今週の練習を実行していない選手には、選んでいる練習メニューを自動で適用してから週を進める
    players.forEach(p => {
      if (!p.practicedThisWeek) applyPracticeGain(p, p.selectedPracticeStatKey);
    });

    const previousWeekIndex = weekIndex;
    weekIndex++;
    seasonEventMessage = "";
    if (weekIndex >= TOTAL_WEEKS) {
      weekIndex = 0;
      schoolYear++;
    }

    if (previousWeekIndex === 0 && weekIndex === 1) {
      // 4月2週目に入学式・スカウトが始まる
      processGraduationAndScout();
      seasonEventMessage = "入学式が行われました。下のスカウト欄から新入部員を選びましょう。";
    } else if (previousWeekIndex === 1 && weekIndex === 2) {
      // スカウトの検討期間はその週だけ。決めなかった候補はいなくなる(投手が0人ならここで確保する)
      scoutCandidates = [];
      ensurePitcherExists();
    }

    officialMatchPlayedThisWeek = false;
    officialMatchResult.textContent = "";
    players.forEach(p => {
      p.practicedThisWeek = false;
      if (p.injuryWeeksLeft > 0) {
        p.injuryWeeksLeft--;
        p.fatigue = Math.max(0, (p.fatigue || 0) - 15); // 療養中は疲労も回復していく
      }
    });

    autoFillLineup();

    const windowT = findWindowTournament();
    if (!windowT && players.length > 0 && lineup.pitcherId && Math.random() < 0.25) {
      const result = runMatch();
      grantMatchExperience();
      practiceGameResult.innerHTML = buildMatchReportHtml("練習試合", result);
    } else {
      practiceGameResult.innerHTML = "";
    }

    renderCalendar();
    renderScoutCandidates();
    renderPlayerList();
  });

  function renderPlayerList() {
    autoFillLineup();
    renderLineupControls();
    renderBulkPracticeControls();
    renderRivalRecords();
    playerListArea.innerHTML = "";
    emptyListNote.style.display = players.length === 0 ? "block" : "none";
    teamPowerLine.textContent = players.length > 0 ? `チームの実力: ${currentTeamTierLabel()}` : "";

    const matchPending = isMatchPendingThisWeek();
    tournamentWeekNote.style.display = (matchPending && players.length > 0) ? "block" : "none";

    players.forEach((player, index) => {
      const div = document.createElement("div");
      div.className = "player";

      const positionLabel = positionLabels[player.position];
      const gradeLabel = playerGradeLabel(player);

      const statLine = statDefs[player.position]
        .map(def => `${def.label}: ${player.stats[def.key]}`)
        .join(" / ");

      const talentBadge = player.talentLabel
        ? `<span class="talent-badge">★ ${player.talentLabel}の才能</span>`
        : "";

      const injured = player.injuryWeeksLeft > 0;
      const injuryBadge = injured
        ? `<span class="injury-badge">🤕 故障中(あと${player.injuryWeeksLeft}週)</span>`
        : "";

      const fatigue = player.fatigue || 0;
      let fatigueClass = "fatigue-ok";
      if (fatigue >= INJURY_RISK_FATIGUE) fatigueClass = "fatigue-danger";
      else if (fatigue >= 40) fatigueClass = "fatigue-warn";

      const menuOptions = practiceMenus[player.position]
        .map(menu => `<option value="${menu.statKey}" ${menu.statKey === player.selectedPracticeStatKey ? "selected" : ""}>${menu.label}</option>`)
        .join("");

      const disablePractice = matchPending || player.practicedThisWeek || injured;
      const buttonDisabled = disablePractice ? "disabled" : "";
      let buttonLabel = "この内容で練習する";
      if (injured) buttonLabel = "故障中は練習できません";
      else if (matchPending) buttonLabel = "今週は公式戦のため練習できません";
      else if (player.practicedThisWeek) buttonLabel = "今週は練習済み";

      div.innerHTML = `
        <span class="player-name">${player.name}</span>
        <span class="player-pos">${positionLabel}</span>
        <span class="player-grade">${gradeLabel}</span>
        <span class="rank-badge">${playerRankLabel(player)}</span>
        ${talentBadge}
        ${injuryBadge}
        <div class="stat-line">${statLine}</div>
        <div class="fatigue-line ${fatigueClass}">疲労: ${fatigue}</div>
        <div class="practice-row">
          <select class="practice-select" data-index="${index}" ${buttonDisabled}>${menuOptions}</select>
          <button class="practice-execute-button" data-index="${index}" ${buttonDisabled}>${buttonLabel}</button>
        </div>
      `;
      playerListArea.appendChild(div);
    });

    updateNextWeekButtonState();
    saveGame();
  }

  // 疲労がこの値を超えると、練習のたびに怪我のリスクが発生する
  const INJURY_RISK_FATIGUE = 70;

  function applyPracticeGain(player, statKey) {
    if (player.injuryWeeksLeft > 0) return; // 故障中は練習できない

    if (statKey === "rest") {
      // 休養: 能力は伸びないが疲労が大きく回復する
      player.fatigue = Math.max(0, (player.fatigue || 0) - (25 + Math.floor(Math.random() * 11)));
      return;
    }

    const gain = 1 + Math.floor(Math.random() * 3); // 1〜3ポイント上がる
    player.stats[statKey] = Math.min(STAT_CAP, player.stats[statKey] + gain);

    player.fatigue = Math.min(100, (player.fatigue || 0) + 15 + Math.floor(Math.random() * 11)); // 15〜25 疲労が溜まる
    if (player.fatigue >= INJURY_RISK_FATIGUE) {
      const injuryChance = 0.05 + (player.fatigue - INJURY_RISK_FATIGUE) * 0.01; // 疲労70で5%、100で35%
      if (Math.random() < injuryChance) {
        player.injuryWeeksLeft = 1 + Math.floor(Math.random() * 3); // 1〜3週間離脱
        player.fatigue = Math.max(0, player.fatigue - 30);
      }
    }
  }

  function practicePlayer(index, statKey) {
    const player = players[index];
    if (player.practicedThisWeek || isMatchPendingThisWeek() || player.injuryWeeksLeft > 0) return;
    player.selectedPracticeStatKey = statKey;
    applyPracticeGain(player, statKey);
    player.practicedThisWeek = true;
    renderPlayerList();
  }

  playerListArea.addEventListener("click", (event) => {
    if (event.target.classList.contains("practice-execute-button")) {
      const index = Number(event.target.dataset.index);
      const select = playerListArea.querySelector(`.practice-select[data-index="${index}"]`);
      practicePlayer(index, select.value);
    }
  });

  playerListArea.addEventListener("change", (event) => {
    if (event.target.classList.contains("practice-select")) {
      const index = Number(event.target.dataset.index);
      players[index].selectedPracticeStatKey = event.target.value;
    }
  });

  const bulkPracticeArea = document.getElementById("bulk-practice-controls");
  const bulkSelectionByPosition = {};

  function renderBulkPracticeControls() {
    bulkPracticeArea.innerHTML = "";
    const positionsPresent = allPositions.filter(position => players.some(p => p.position === position));
    if (positionsPresent.length === 0) return;

    positionsPresent.forEach(position => {
      const currentChoice = bulkSelectionByPosition[position] || practiceMenus[position][0].statKey;
      const options = practiceMenus[position]
        .map(menu => `<option value="${menu.statKey}" ${menu.statKey === currentChoice ? "selected" : ""}>${menu.label}</option>`)
        .join("");
      const row = document.createElement("div");
      row.className = "bulk-row";
      row.innerHTML = `
        <span class="bulk-label">${positionLabels[position]}</span>
        <select class="bulk-select" data-position="${position}">${options}</select>
        <button class="bulk-apply-button" data-position="${position}">全員に反映</button>
      `;
      bulkPracticeArea.appendChild(row);
    });
  }

  bulkPracticeArea.addEventListener("change", (event) => {
    if (!event.target.classList.contains("bulk-select")) return;
    bulkSelectionByPosition[event.target.dataset.position] = event.target.value;
  });

  bulkPracticeArea.addEventListener("click", (event) => {
    if (!event.target.classList.contains("bulk-apply-button")) return;
    const position = event.target.dataset.position;
    const select = bulkPracticeArea.querySelector(`.bulk-select[data-position="${position}"]`);
    const statKey = select.value;
    bulkSelectionByPosition[position] = statKey;
    players.forEach(player => {
      if (player.position === position) player.selectedPracticeStatKey = statKey;
    });
    renderPlayerList();
  });

  if (!loadGame()) {
    generateInitialRoster();
    ensurePitcherExists();
  }

  renderCalendar();
  renderScoutCandidates();
  renderPlayerList();
</script>

</body>
</html>
