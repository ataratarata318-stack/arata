<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>高校野球 選手育成シミュレーション</title>
<style>
  body {
    font-family: "Hiragino Sans", "Meiryo", sans-serif;

  .card {
    background: white;

  label {

    padding: 4px 0;

  }
  .news-row {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    padding: 6px 0;

  }
  .news-row .news-date {
    display: inline-block;
    font-size: 11px;
    color: #888;
    margin-right: 6px;
    font-family: "Hiragino Sans", "Meiryo", sans-serif;
  }

    font-weight: bold;
  }
  .rival-row .rival-trait {
    color: #888;
    font-size: 11px;
    display: block;
  }
</style>
</head>
<body>

<h1>⚾ 高校野球 選手育成シミュレーション</h1>

<div style="text-align:center; max-width:480px; margin:0 auto; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">
  <button id="export-button" style="width:auto; margin-top:0; padding:6px 14px; font-size:12px; background:#3d7dd6;">セーブデータを書き出す</button>
  <button id="import-button" style="width:auto; margin-top:0; padding:6px 14px; font-size:12px; background:#3d7dd6;">セーブデータを読み込む</button>
  <input type="file" id="import-file-input" accept="application/json" style="display:none;">
  <button id="reset-button" style="width:auto; margin-top:0; padding:6px 14px; font-size:12px; background:#b3261e;">データをリセットして最初から</button>
</div>

<div class="card">
  <div class="calendar-line" id="calendar-line"></div>
  <div class="status-line" id="status-line"></div>
  <div id="match-preview" style="display:none;"></div>
  <button id="official-match-button" class="official-match-button" style="display:none;">公式戦を行う</button>
  <div id="tactics-card" style="display:none;">
    <div id="tactics-prompt"></div>
    <div id="tactics-options"></div>
  </div>
  <div id="official-match-result"></div>
  <button id="next-week-button">次の週へ</button>
  <div id="practice-game-result"></div>
  <div id="season-event-result"></div>
</div>

<div class="card" id="news-card" style="display:none;">
  <h2 style="font-size:16px; margin-top:0;">📰 部内ニュース</h2>
  <div id="news-list"></div>
</div>

<div class="card" id="scout-card" style="display:none;">
  <h2 style="font-size:16px; margin-top:0;">スカウト候補</h2>
  <div class="empty-note" style="margin-top:0;">気に入った選手を選んで入部させましょう(全員入れる必要はありません)。</div>
  <div id="scout-list"></div>
</div>

<div class="card">
  <h2 style="font-size:16px; margin-top:0;">スタメン・守備・打順</h2>
  <div class="empty-note" style="margin-top:0;">試合はここで選んだ9人だけで戦います。出場した選手だけ試合の経験で能力が伸びます。守備位置と打順(何番を打つか)は別々に設定できます。</div>
  <button id="auto-lineup-button" style="background:#6a4fb3;">最適なスタメンを自動セット</button>
  <label>先発投手</label>
  <select id="lineup-pitcher-select"></select>
  <label style="margin-top:12px;">守備位置(誰がどこを守るか)</label>
  <div id="defense-area" style="margin-top:4px;"></div>
  <label style="margin-top:12px;">打順(誰が何番を打つか)</label>
  <div id="batting-order-area" style="margin-top:4px;"></div>
</div>

<div class="card">
  <h2 style="font-size:16px; margin-top:0;">登録した選手</h2>
  <div id="team-power-line" class="team-power-line"></div>
  <div id="tournament-week-note" class="empty-note" style="display:none;">大会期間中のため、今週は練習できません。</div>
  <div id="bulk-practice-controls"></div>
  <div id="player-list"></div>
  <div id="empty-list-note" class="empty-note">まだ選手が登録されていません。</div>
</div>

<div class="card">
  <h2 style="font-size:16px; margin-top:0;">ライバル校との対戦成績</h2>
  <div id="rivals-list"></div>
  <div id="rivals-empty-note" class="empty-note">まだ対戦記録がありません。</div>
</div>

<script>
  const STAT_CAP = 150;
  const players = [];

  const positionLabels = {
    pitcher: "投手",
    catcher: "捕手",
    infielder: "内野手",
    outfielder: "外野手",
  };

  // 投手は専用の能力値、それ以外の守備位置(捕手・内野手・外野手)は共通の能力値を使う
  const fielderStatDefs = [
    { key: "batting", label: "打力" },
    { key: "running", label: "走力" },
    { key: "fielding", label: "守備力" },
    { key: "arm", label: "肩力" },
  ];

  const statDefs = {
    pitcher: [
      { key: "velocity", label: "球速" },
      { key: "breaking", label: "変化球" },
      { key: "control", label: "コントロール" },
      { key: "stamina", label: "スタミナ" },
    ],
    catcher: fielderStatDefs,
    infielder: fielderStatDefs,
    outfielder: fielderStatDefs,
  };

  // 練習メニュー: 能力値ごとに専用の練習を用意する。「休養」は疲労を回復する特別なメニュー
  const REST_MENU = { statKey: "rest", label: "休養" };
  const practiceMenus = {
    pitcher: [
      { statKey: "velocity", label: "投球練習" },
      { statKey: "breaking", label: "変化球練習" },
      { statKey: "control", label: "コントロール練習" },
      { statKey: "stamina", label: "走り込み" },
      REST_MENU,
    ],
    catcher: [
      { statKey: "batting", label: "バッティング練習" },
      { statKey: "running", label: "走り込み" },
      { statKey: "fielding", label: "守備練習" },
      { statKey: "arm", label: "肩力トレーニング" },
      REST_MENU,
    ],
    infielder: [
      { statKey: "batting", label: "バッティング練習" },
      { statKey: "running", label: "走り込み" },
      { statKey: "fielding", label: "守備練習" },
      { statKey: "arm", label: "肩力トレーニング" },
      REST_MENU,
    ],
    outfielder: [
      { statKey: "batting", label: "バッティング練習" },
      { statKey: "running", label: "走り込み" },
      { statKey: "fielding", label: "守備練習" },
      { statKey: "arm", label: "肩力トレーニング" },
      REST_MENU,
    ],
  };

  // 1ヶ月=4週間の簡易カレンダー。4月を0週目として48週で1年
  const WEEKS_PER_MONTH = 4;
  const monthNames = ["4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月", "1月", "2月", "3月"];
  const TOTAL_WEEKS = monthNames.length * WEEKS_PER_MONTH;

  // 公式戦の日程(週番号は0始まり)
  const tournaments = [
    { id: "spring", name: "春季大会", startWeek: 2, endWeek: 7, roundsToWin: 4 },
    { id: "summer", name: "夏の大会(地方予選)", startWeek: 12, endWeek: 15, roundsToWin: 4 },
    { id: "koshien", name: "甲子園(全国大会)", startWeek: 16, endWeek: 19, roundsToWin: 3, requiresChampion: "summer" },
    { id: "fall", name: "秋季大会", startWeek: 24, endWeek: 27, roundsToWin: 4 },
  ];
  const tournamentState = {};
  tournaments.forEach(t => {
    tournamentState[t.id] = { currentRound: 0, eliminated: false, champion: false, resetYear: 0, previewOpponent: null };
  });

  let schoolYear = 1;
  let weekIndex = 0;
  let officialMatchPlayedThisWeek = false;
  let seasonEventMessage = "";
  let scoutCandidates = [];
  let scoutIdCounter = 0;
  let playerIdCounter = 0;
  let scoutBonusTierBoost = 0; // 「有望な転校生」イベントで次のスカウトの質が上がる
  // 公式戦の采配フェーズ中の一時的な状態(攻撃采配→守備采配→結果、の2段階)
  let pendingMatch = null;

  // スタメン: pitcherIdが先発投手。defenseは「誰がどこを守るか」(捕手1・内野手4・外野手3の固定8枠)、
  // battingOrderは「誰が何番を打つか」で、defenseで選んだ選手を自由な順番に並べるだけ(守備位置とは無関係)
  function defaultLineup() {
    return {
      pitcherId: null,
      defense: [
        { role: "catcher", playerId: null },
        { role: "infielder", playerId: null },
        { role: "infielder", playerId: null },
        { role: "infielder", playerId: null },
        { role: "infielder", playerId: null },
        { role: "outfielder", playerId: null },
        { role: "outfielder", playerId: null },
        { role: "outfielder", playerId: null },
      ],
      battingOrder: [null, null, null, null, null, null, null, null],
    };
  }
  let lineup = defaultLineup();
  const SAVE_KEY = "baseballSimSave";

  // 新入部員の自動生成に使う名前とポジションの候補
  const sampleRecruitNames = [
    "佐藤健太", "鈴木大輔", "高橋翔", "田中蓮", "伊藤陸", "渡辺樹", "山本颯太", "中村悠斗",
    "小林大和", "加藤悠", "吉田颯", "斎藤諒", "山口大翔", "松本蒼", "井上駿", "木村陽翔",
    "林拓海", "清水湊", "山崎大輝", "阿部樹", "森大地", "池田悠真", "橋本蒼太", "石川陽向",
    "前田輝", "藤田航", "岡田悠斗", "長谷川大和", "村上蓮", "近藤陽太", "坂本翼", "遠藤翔太",
  ];
  const allPositions = ["pitcher", "catcher", "infielder", "outfielder"];

  // ライバル校: 対戦相手に個性を持たせる
  const RIVAL_SCHOOLS = [
    { name: "青葉学院", trait: "強打を誇る強豪" },
    { name: "北陵高校", trait: "堅い守備が持ち味" },
    { name: "臨海工業", trait: "俊足を活かした機動力野球" },
    { name: "旭丘高校", trait: "エースの好投が光る" },
    { name: "緑ヶ丘学園", trait: "粘り強い攻撃が身上" },
    { name: "港南商業", trait: "一発長打が魅力" },
    { name: "白鷺高校", trait: "堅実なチームプレー" },
    { name: "桜台高校", trait: "勢いのある若いチーム" },
    { name: "常盤大学附属", trait: "伝統ある名門校" },
    { name: "海浜学院", trait: "波に乗ると止まらない" },
  ];
  const rivalRecords = {};

  function pickRivalSchool() {
    return RIVAL_SCHOOLS[Math.floor(Math.random() * RIVAL_SCHOOLS.length)];
  }

  function recordRivalResult(schoolName, isWin) {
    if (!rivalRecords[schoolName]) rivalRecords[schoolName] = { wins: 0, losses: 0 };
    if (isWin) rivalRecords[schoolName].wins++;
    else rivalRecords[schoolName].losses++;
  }

  // チームの強さ・選手個人の強さを数字ではなく段階で表現する
  const POWER_TIERS = [
    { max: 99, label: "弱小" },
    { max: 199, label: "普通" },
    { max: 299, label: "中堅" },
    { max: 399, label: "強豪" },
    { max: Infinity, label: "甲子園常連校" },
  ];

  function powerTierIndex(averagePower) {
    return POWER_TIERS.findIndex(tier => averagePower <= tier.max);
  }

  function powerTierLabel(averagePower) {
    return POWER_TIERS[powerTierIndex(averagePower)].label;
  }

  function currentTeamTierLabel() {
    if (players.length === 0) return "選手なし";
    return powerTierLabel(totalTeamPower() / players.length);
  }

  function playerGradeLabel(player) {
    const grade = schoolYear - player.enrollYear + 1;
    return grade >= 4 ? "卒業" : `${grade}年生`;
  }

  function playerPowerSum(player) {
    return Object.values(player.stats).reduce((s, v) => s + v, 0);
  }

  // 選手個人の能力は「弱小」のようなチーム向けの言葉ではなく、野球ゲームでおなじみのランク(G〜S)で表現する
  const PLAYER_RANKS = [
    { max: 99, label: "G" },
    { max: 149, label: "F" },
    { max: 199, label: "D" },
    { max: 249, label: "C" },
    { max: 299, label: "B" },
    { max: 349, label: "A" },
    { max: Infinity, label: "S" },
  ];

  function playerRankLabel(player) {
    const sum = playerPowerSum(player);
    return PLAYER_RANKS.find(rank => sum <= rank.max).label;
  }

  // ③ 成長がニュースの見出しとして伝わるようにする
  const newsFeed = [];

  function addNewsEntry(text) {
    const monthIndex = Math.floor(weekIndex / WEEKS_PER_MONTH);
    newsFeed.unshift({ dateLabel: `${schoolYear}年目${monthNames[monthIndex]}`, text });
    if (newsFeed.length > 15) newsFeed.length = 15;
  }

  const RANK_MILESTONE_MESSAGES = {
    C: p => `${p.name}が着実に実力をつけてきた。`,
    B: p => `${p.name}がチームの主力に成長した!`,
    A: p => `${p.name}が県内屈指の選手へと成長した!`,
    S: p => (p.position === "pitcher"
      ? `${p.name}がエースの風格を漂わせ始めた!`
      : `${p.name}が主砲としての貫禄を見せている!`),
  };
  const RANK_ORDER = PLAYER_RANKS.map(r => r.label);

  // 選手のランクが上がったら、ニュース見出しとして知らせる
  function checkPlayerRankMilestones() {
    players.forEach(p => {
      const rank = playerRankLabel(p);
      if (rank !== p.lastAnnouncedRank) {
        const oldIndex = RANK_ORDER.indexOf(p.lastAnnouncedRank);
        const newIndex = RANK_ORDER.indexOf(rank);
        if (newIndex > oldIndex && RANK_MILESTONE_MESSAGES[rank]) {
          addNewsEntry(`📰 ${RANK_MILESTONE_MESSAGES[rank](p)}(ランク${rank})`);
        }
        p.lastAnnouncedRank = rank;
      }
    });
  }

  // 選手ごとの個性。才能とは別に、練習の伸び方・怪我のしやすさ・大事な試合での粘りなどに影響する
  const PERSONALITY_TRAITS = [
    { id: "late-bloomer", label: "大器晩成", desc: "1年生のうちは伸びが遅いが、2年生以降に伸びが良くなる" },
    { id: "injury-prone", label: "怪我しやすい", desc: "怪我のリスクがやや高い" },
    { id: "mental-strength", label: "精神力が強い", desc: "準決勝・決勝など大事な試合に強い" },
    { id: "hard-worker", label: "練習の虫", desc: "練習の効果が高い" },
    { id: "durable", label: "丈夫", desc: "疲労が溜まりにくい" },
  ];

  function getPersonality(player) {
    return PERSONALITY_TRAITS.find(t => t.id === player.personalityId) || null;
  }

  function rollPersonalityId() {
    if (Math.random() < 0.3) {
      return PERSONALITY_TRAITS[Math.floor(Math.random() * PERSONALITY_TRAITS.length)].id;
    }
    return null;
  }

  // オフシーズンの週に、まれに起きる小さな出来事(良いことも悪いこともある)
  const RANDOM_EVENTS = [
    {
      id: "rain",
      condition: () => players.length > 0,
      apply: () => {
        players.forEach(p => { p.fatigue = Math.min(100, (p.fatigue || 0) + 5 + Math.floor(Math.random() * 6)); });
        return "☔ 雨で思うように練習できず、全員に疲労が少し溜まった。";
      },
    },
    {
      id: "ob-visit",
      condition: () => players.length > 0,
      apply: () => {
        players.forEach(p => { p.fatigue = Math.max(0, (p.fatigue || 0) - (15 + Math.floor(Math.random() * 11))); });
        return "🎁 OBが差し入れを持って激励に来てくれた!全員の疲労が回復した。";
      },
    },
    {
      id: "transfer-rumor",
      condition: () => true,
      apply: () => {
        scoutBonusTierBoost = 1;
        return "👀 「有望な転校生がいる」という噂が流れている…次のスカウトに期待がかかる。";
      },
    },
    {
      id: "injury-recovery",
      condition: () => players.some(p => p.injuryWeeksLeft > 0),
      apply: () => {
        const injured = players.filter(p => p.injuryWeeksLeft > 0);
        const target = injured[Math.floor(Math.random() * injured.length)];
        target.injuryWeeksLeft = Math.max(0, target.injuryWeeksLeft - 1);
        return `🏥 ${target.name}の回復が順調で、復帰が早まりそうだ。`;
      },
    },
    {
      id: "growth-spurt",
      condition: () => players.length > 0,
      apply: () => {
        const target = players[Math.floor(Math.random() * players.length)];
        const defs = statDefs[target.position];
        const def = defs[Math.floor(Math.random() * defs.length)];
        const gain = 10 + Math.floor(Math.random() * 11);
        target.stats[def.key] = Math.min(STAT_CAP, target.stats[def.key] + gain);
        return `📈 ${target.name}が急成長期に入ったようだ!(${def.label}が伸びた)`;
      },
    },
    {
      id: "minor-slump",
      condition: () => players.length > 0,
      apply: () => {
        const target = players[Math.floor(Math.random() * players.length)];
        target.fatigue = Math.min(100, (target.fatigue || 0) + 20 + Math.floor(Math.random() * 11));
        return `😴 ${target.name}が体調を崩しがちで、疲労が溜まっているようだ。`;
      },
    },
  ];

  function maybeTriggerRandomEvent() {
    if (Math.random() >= 0.35) return "";
    const candidates = RANDOM_EVENTS.filter(e => e.condition());
    if (candidates.length === 0) return "";
    const event = candidates[Math.floor(Math.random() * candidates.length)];
    return event.apply();
  }

  function createPlayer(name, position, enrollYear) {
    const { stats, talentLabel } = rollNewPlayerStats(position);
    playerIdCounter++;
    const player = {
      id: playerIdCounter,
      personalityId: rollPersonalityId(),
      name,
      position,
      stats,
      talentLabel,
      enrollYear: enrollYear === undefined ? schoolYear : enrollYear,
      practicedThisWeek: false,
      selectedPracticeStatKey: practiceMenus[position][0].statKey,
      fatigue: 0,
      injuryWeeksLeft: 0,
    };
    player.lastAnnouncedRank = playerRankLabel(player); // これ以降のランクアップだけをニュースにする
    return player;
  }

  function randomRecruitName(excludeNames) {
    const activeNames = new Set([...players.map(p => p.name), ...(excludeNames || [])]);
    const available = sampleRecruitNames.filter(n => !activeNames.has(n));
    const pool = available.length > 0 ? available : sampleRecruitNames;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // 実際のチーム編成に近い比率(投手・捕手は少なめ、内野手は多めなど)でポジションを決める
  const POSITION_WEIGHTS = { pitcher: 0.2, catcher: 0.15, infielder: 0.4, outfielder: 0.25 };

  function randomPosition() {
    const r = Math.random();
    let acc = 0;
    for (const position of allPositions) {
      acc += POSITION_WEIGHTS[position];
      if (r <= acc) return position;
    }
    return allPositions[allPositions.length - 1];
  }

  // 投手が0人にならないよう、必要なら直近の選手を投手として振り直す
  function ensurePitcherExists() {
    if (players.length === 0 || players.some(p => p.position === "pitcher")) return;
    const target = players[players.length - 1];
    target.position = "pitcher";
    const { stats, talentLabel } = rollNewPlayerStats("pitcher");
    target.stats = stats;
    target.talentLabel = talentLabel;
    target.selectedPracticeStatKey = practiceMenus.pitcher[0].statKey;
  }

  // ゲーム開始時、すでに2・3年生がいるチームを引き継いだ状態からスタートする
  function generateInitialRoster() {
    // 3年生(enrollYear = schoolYear - 2)と2年生(enrollYear = schoolYear - 1)を何人か配置
    [{ grade: 3, count: 3 + Math.floor(Math.random() * 2) },
     { grade: 2, count: 3 + Math.floor(Math.random() * 2) }].forEach(({ grade, count }) => {
      const enrollYear = schoolYear - (grade - 1);
      for (let i = 0; i < count; i++) {
        const player = createPlayer(randomRecruitName(), randomPosition(), enrollYear);
        // 上級生はすでに1〜2年分練習を積んでいるぶん、能力を底上げしておく
        const yearsTrained = grade - 1;
        const defs = statDefs[player.position];
        for (let y = 0; y < yearsTrained; y++) {
          for (let k = 0; k < 3; k++) {
            const def = defs[Math.floor(Math.random() * defs.length)];
            const gain = 5 + Math.floor(Math.random() * 10);
            player.stats[def.key] = Math.min(STAT_CAP, player.stats[def.key] + gain);
          }
        }
        players.push(player);
      }
    });
  }

  // 卒業させたうえで、スカウト候補(新入部員候補)を生成する。人数はほぼ一定で、
  // 学校の強さは「人数」ではなく候補選手の「質」(能力の初期値・才能の出やすさ)に反映する
  function processGraduationAndScout() {
    // 4年目を迎えた(=3年生を終えた)選手は卒業して抜ける
    for (let i = players.length - 1; i >= 0; i--) {
      const grade = schoolYear - players[i].enrollYear + 1;
      if (grade > 3) players.splice(i, 1);
    }
    scoutCandidates = generateScoutCandidates();
  }

  function generateScoutCandidates() {
    const baseTierIndex = players.length > 0
      ? powerTierIndex(totalTeamPower() / players.length)
      : 0;
    const tierIndex = Math.min(POWER_TIERS.length - 1, baseTierIndex + scoutBonusTierBoost);
    scoutBonusTierBoost = 0; // 「有望な転校生」イベントの効果は次の1回のスカウトで消費される
    const poolSize = 4 + Math.floor(Math.random() * 2); // 4〜5人の候補を提示する(全員入部させる必要はない)

    const candidates = [];
    const usedNames = [];
    for (let i = 0; i < poolSize; i++) {
      const position = randomPosition();
      const name = randomRecruitName(usedNames);
      usedNames.push(name);
      const { stats, talentLabel } = rollNewPlayerStats(position, tierIndex);
      scoutIdCounter++;
      candidates.push({ id: scoutIdCounter, name, position, stats, talentLabel, personalityId: rollPersonalityId() });
    }

    // 投手・捕手が1人もいない場合、必ず候補に含める(内野手・外野手は人数が多いので偏っても致命傷になりにくい)
    const forcedUsed = new Set();
    function forcePosition(position) {
      const idx = candidates.findIndex((c, i) => !forcedUsed.has(i));
      if (idx === -1) return;
      forcedUsed.add(idx);
      const target = candidates[idx];
      target.position = position;
      const rerolled = rollNewPlayerStats(position, tierIndex);
      target.stats = rerolled.stats;
      target.talentLabel = rerolled.talentLabel;
    }

    if (!players.some(p => p.position === "pitcher") && !candidates.some(c => c.position === "pitcher")) {
      forcePosition("pitcher");
    }
    if (!players.some(p => p.position === "catcher") && !candidates.some(c => c.position === "catcher")) {
      forcePosition("catcher");
    }

    return candidates;
  }

  function recruitCandidate(id) {
    const index = scoutCandidates.findIndex(c => c.id === id);
    if (index === -1) return;
    const candidate = scoutCandidates[index];
    playerIdCounter++;
    const newPlayer = {
      id: playerIdCounter,
      personalityId: candidate.personalityId,
      name: candidate.name,
      position: candidate.position,
      stats: candidate.stats,
      talentLabel: candidate.talentLabel,
      enrollYear: schoolYear,
      practicedThisWeek: false,
      selectedPracticeStatKey: practiceMenus[candidate.position][0].statKey,
      fatigue: 0,
      injuryWeeksLeft: 0,
    };
    newPlayer.lastAnnouncedRank = playerRankLabel(newPlayer);
    players.push(newPlayer);
    scoutCandidates.splice(index, 1);
    renderScoutCandidates();
    renderPlayerList();
  }

  function rollNewPlayerStats(position, tierIndex) {
    const idx = tierIndex || 0;
    const defs = statDefs[position];
    const stats = {};
    // 入学したての1年生は基本的に能力が低め。学校が強いほど、少しだけ有望な新入生が来やすくなる
    const baseMin = 15 + idx * 3;
    const baseMax = 30 + idx * 5;
    defs.forEach(def => {
      stats[def.key] = baseMin + Math.floor(Math.random() * (baseMax - baseMin + 1));
    });

    // 一定確率で「才能」が発動し、1つの能力だけ大きく伸びる(学校が強いほど才能持ちが出やすい)
    let talentLabel = null;
    const talentChance = 0.25 + idx * 0.08;
    if (Math.random() < talentChance) {
      const def = defs[Math.floor(Math.random() * defs.length)];
      const bonus = 15 + Math.floor(Math.random() * 21); // +15〜35
      stats[def.key] = Math.min(STAT_CAP, stats[def.key] + bonus);
      talentLabel = def.label;
    }

    return { stats, talentLabel };
  }

        `;

  function renderLineupControls() {
    const pitchers = players.filter(p => p.position === "pitcher" && isFitToPlay(p));
    lineupPitcherSelect.innerHTML = pitchers.length > 0
      ? pitchers.map(p => `<option value="${p.id}" ${p.id === lineup.pitcherId ? "selected" : ""}>${p.name}(${playerGradeLabel(p)}/${playerRankLabel(p)})</option>`).join("")
      : `<option value="">投手がいません</option>`;

    // 守備位置(捕手1・内野手4・外野手3): 誰がどこを守るか
    defenseArea.innerHTML = "";
    const fielders = players.filter(p => p.position !== "pitcher" && isFitToPlay(p));
    const roleCounters = {};
    lineup.defense.forEach((slot, idx) => {
      roleCounters[slot.role] = (roleCounters[slot.role] || 0) + 1;
      const roleLabel = slot.role === "catcher" ? "捕手" : `${positionLabels[slot.role]}${roleCounters[slot.role]}`;

      const usedElsewhere = lineup.defense.filter((s, i) => i !== idx).map(s => s.playerId);
      const selectable = fielders.filter(p => !usedElsewhere.includes(p.id));
      const optionsHtml = [`<option value="">-- 空き --</option>`]
        .concat(selectable.map(p => {
          const mismatchNote = p.position === slot.role ? "" : " ※適性外-15%";
          return `<option value="${p.id}" ${p.id === slot.playerId ? "selected" : ""}>${p.name}(${positionLabels[p.position]}/${playerGradeLabel(p)}/${playerRankLabel(p)})${mismatchNote}</option>`;
        }))
        .join("");
      const currentPlayer = slot.playerId ? players.find(p => p.id === slot.playerId) : null;
      const mismatchBadge = (currentPlayer && currentPlayer.position !== slot.role)
        ? `<span class="mismatch-badge">適性外 -15%</span>`
        : "";
      const row = document.createElement("div");
      row.className = "lineup-row";
      row.innerHTML = `<label>${roleLabel}</label><select class="defense-select" data-slot="${idx}">${optionsHtml}</select>${mismatchBadge}`;
      defenseArea.appendChild(row);
    });

    // 打順(1〜8番): 守備についた選手の中から、何番を打つかを自由に決める(守備位置とは無関係)
    battingOrderArea.innerHTML = "";
    const assignedPlayers = lineup.defense
      .map(s => s.playerId)
      .filter(Boolean)
      .map(id => players.find(p => p.id === id))
      .filter(Boolean);
    for (let slot = 0; slot < 8; slot++) {
      const usedElsewhere = lineup.battingOrder.filter((id, idx) => idx !== slot);
      const selectable = assignedPlayers.filter(p => !usedElsewhere.includes(p.id));
      const currentId = lineup.battingOrder[slot];
      const optionsHtml = [`<option value="">-- 空き --</option>`]
        .concat(selectable.map(p => `<option value="${p.id}" ${p.id === currentId ? "selected" : ""}>${p.name}(${positionLabels[p.position]})</option>`))
        .join("");
      const row = document.createElement("div");
      row.className = "lineup-row";
      row.innerHTML = `<label>${slot + 1}番</label><select class="batting-order-select" data-slot="${slot}">${optionsHtml}</select>`;
      battingOrderArea.appendChild(row);
    }
  }

  function saveGame() {
    const state = {
      players,
      schoolYear,
      weekIndex,
      officialMatchPlayedThisWeek,
      seasonEventMessage,
      tournamentState,
      scoutCandidates,
      scoutIdCounter,
      playerIdCounter,
      lineup,
      bulkSelectionByPosition,
      rivalRecords,
      newsFeed,
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {
      // 保存に失敗しても(容量制限など)ゲーム自体は続行できるようにする
    }
  }

  function loadGame() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    try {
      const state = JSON.parse(raw);
      players.length = 0;
      players.push(...state.players);
      schoolYear = state.schoolYear;
      weekIndex = state.weekIndex;
      officialMatchPlayedThisWeek = state.officialMatchPlayedThisWeek;
      seasonEventMessage = state.seasonEventMessage || "";
      Object.keys(tournamentState).forEach(id => {
        if (state.tournamentState && state.tournamentState[id]) {
          Object.assign(tournamentState[id], state.tournamentState[id]);
        }
      });
      scoutCandidates = state.scoutCandidates || [];
      scoutIdCounter = state.scoutIdCounter || 0;
      playerIdCounter = state.playerIdCounter || 0;
      // 旧形式(orderのみ)のセーブデータは互換性がないため、その場合は新しい空のスタメンから始める
      lineup = (state.lineup && Array.isArray(state.lineup.defense)) ? state.lineup : defaultLineup();
      Object.assign(bulkSelectionByPosition, state.bulkSelectionByPosition || {});
      Object.assign(rivalRecords, state.rivalRecords || {});
      newsFeed.length = 0;
      newsFeed.push(...(state.newsFeed || []));
      return true;
    } catch (e) {
      return false;
    }
  }

  function roundLabel(roundsToWin, roundNumber) {
    const fromEnd = roundsToWin - roundNumber;
    if (fromEnd === 0) return "決勝";
    if (fromEnd === 1) return "準決勝";
    return `${roundNumber}回戦`;
  }

  function ensureTournamentReset(t) {
    const state = tournamentState[t.id];
    if (state.resetYear !== schoolYear && weekIndex >= t.startWeek) {
      state.currentRound = 0;
      state.eliminated = false;
      state.champion = false;
      state.previewOpponent = null;
      state.resetYear = schoolYear;
    }
  }

  // 大会の各ラウンドの意気込み・煽り文句
  function getStakesText(tournament, roundNumber) {
    if (roundNumber === tournament.roundsToWin) {
      return tournament.id === "summer" ? "勝てば甲子園出場!" : `勝てば${tournament.name}優勝!`;
    }
    if (roundNumber === tournament.roundsToWin - 1) return "あと1勝で決勝進出!";
    if (roundNumber === 1) return "まずはここを突破したい一戦。";
    return "着実に勝ち進みたいところ。";
  }

  function findWindowTournament() {
    return tournaments.find(t => weekIndex >= t.startWeek && weekIndex <= t.endWeek);
  }

  function isMatchAvailable(t) {
    if (!t) return false;
    ensureTournamentReset(t);
    const state = tournamentState[t.id];
    if (state.eliminated || state.champion) return false;
    if (officialMatchPlayedThisWeek) return false;
    if (t.requiresChampion) {
      const reqState = tournamentState[t.requiresChampion];
      if (!reqState.champion || reqState.resetYear !== schoolYear) return false;
    }
    return true;
  }

  function totalTeamPower() {
    return players.reduce((sum, player) => {
      const statValues = Object.values(player.stats);
      return sum + statValues.reduce((s, v) => s + v, 0);
    }, 0);
  }

  function getStartingPlayers() {
    const ids = [lineup.pitcherId, ...lineup.defense.map(s => s.playerId)].filter(Boolean);
    return players.filter(p => ids.includes(p.id));
  }

  function isFitToPlay(player) {
    return !player.injuryWeeksLeft || player.injuryWeeksLeft <= 0;
  }

  // 守備位置(本来のポジション)と違う選手をその守備で起用すると、試合では能力が少し低く発揮される(適性外)
  function defenseFitMultiplier(player, role) {
    return player.position === role ? 1.0 : 0.85;
  }

  // スタメンに入っている選手だけで試合の力を計算する。打順(何番を打つか)の1〜5番は少し重みを大きくする
  function totalLineupPower() {
    let sum = 0;
    const pitcher = players.find(p => p.id === lineup.pitcherId);
    if (pitcher) sum += playerPowerSum(pitcher);

    lineup.defense.forEach(slot => {
      if (!slot.playerId) return;
      const p = players.find(pl => pl.id === slot.playerId);
      if (!p) return;
      const battingIndex = lineup.battingOrder.indexOf(slot.playerId);
      const battingWeight = (battingIndex !== -1 && battingIndex < 5) ? 1.15 : 1.0;
      sum += playerPowerSum(p) * battingWeight * defenseFitMultiplier(p, slot.role);
    });
    return sum;
  }

  // 卒業・故障などでいなくなった選手をスタメンから外すだけで、代わりの選手を勝手に入れたりはしない
  // (自動で最適に組みたいときは「最適なスタメンを自動セット」ボタンを使う)
  function validateLineup() {
    if (lineup.pitcherId) {
      const p = players.find(pl => pl.id === lineup.pitcherId);
      if (!p || p.position !== "pitcher" || !isFitToPlay(p)) lineup.pitcherId = null;
    }
    lineup.defense.forEach(slot => {
      if (slot.playerId) {
        const p = players.find(pl => pl.id === slot.playerId);
        if (!p || !isFitToPlay(p)) slot.playerId = null;
      }
    });
    const defenseIds = new Set(lineup.defense.map(s => s.playerId).filter(Boolean));
    lineup.battingOrder = lineup.battingOrder.map(id => (id && defenseIds.has(id)) ? id : null);
  }

  // 「最適なスタメンを自動セット」ボタンから呼ばれる。押したときだけ組み直し、それ以外では勝手に変えない
  function autoOptimizeLineup() {
    const pitchers = players.filter(p => p.position === "pitcher" && isFitToPlay(p));
    const bestPitcher = [...pitchers].sort((a, b) => playerPowerSum(b) - playerPowerSum(a))[0];
    lineup.pitcherId = bestPitcher ? bestPitcher.id : null;

    const availableFielders = players.filter(p => p.position !== "pitcher" && isFitToPlay(p));
    const usedIds = new Set();
    lineup.defense.forEach(slot => {
      // まず本来のポジションに合う選手の中で一番強い人を探す(いなければ他の選手で代用)
      let candidates = availableFielders.filter(p => p.position === slot.role && !usedIds.has(p.id));
      if (candidates.length === 0) {
        candidates = availableFielders.filter(p => !usedIds.has(p.id));
      }
      candidates.sort((a, b) => playerPowerSum(b) - playerPowerSum(a));
      if (candidates[0]) {
        slot.playerId = candidates[0].id;
        usedIds.add(candidates[0].id);
      } else {
        slot.playerId = null;
      }
    });

    // 打順: 守備についた選手を能力の高い順に並べる(強い選手ほど重みの大きい上位打順に入る)
    const assignedIds = lineup.defense.map(s => s.playerId).filter(Boolean);
    assignedIds.sort((a, b) => playerPowerSum(players.find(p => p.id === b)) - playerPowerSum(players.find(p => p.id === a)));
    lineup.battingOrder = assignedIds.slice(0, 8);
    while (lineup.battingOrder.length < 8) lineup.battingOrder.push(null);
  }

  // 準決勝・決勝など大事な試合では、「精神力が強い」選手がスタメンにいるとチームの実効能力が少し上がる
  function mentalStrengthBonus(roundInfo) {
    if (!roundInfo || roundInfo.roundsToWin <= 1) return 1;
    const isBigMoment = roundInfo.roundNumber >= roundInfo.roundsToWin - 1; // 準決勝・決勝
    if (!isBigMoment) return 1;
    const count = getStartingPlayers().filter(p => {
      const personality = getPersonality(p);
      return personality && personality.id === "mental-strength";
    }).length;
    return 1 + count * 0.05;
  }

  // 攻撃采配: バッターにどう打たせるか。チームの実効能力を上下させる(打力平均が高いほど積極策が活きる)
  const BATTING_APPROACHES = [
    { id: "power", label: "長打狙い", desc: "大きな当たりを狙う。ハマれば大量点、外れると無得点のことも" },
    { id: "swing", label: "強振", desc: "積極的に振っていく。長打狙いよりはやや手堅い" },
    { id: "meet", label: "ミート", desc: "当てることを優先する。安定した選択" },
    { id: "bunt", label: "バント", desc: "手堅く走者を進める。確実だが大量点は望みにくい" },
    { id: "wait", label: "見送り", desc: "じっくり球を見極め、相手の乱れを待つ" },
  ];

  // 攻撃采配の効果は「そのチャンスの回」に加わる得点のみ(試合全体には影響しない)
  function resolveBattingApproach(approachId, battingPower) {
    const scale = Math.max(0.5, Math.min(1.5, battingPower / 60));
    let extraRuns = 0;
    let flavor = "";
    switch (approachId) {
      case "power":
        if (Math.random() < 0.45 * scale) { extraRuns = 2 + Math.floor(Math.random() * 3); flavor = "積極的な長打狙いがハマり、一気に加点!"; }
        else { flavor = "大振りが響かず、この回は無得点だった。"; }
        break;
      case "swing":
        if (Math.random() < 0.55 * scale) { extraRuns = 1 + Math.floor(Math.random() * 3); flavor = "強振の姿勢が実を結び加点した。"; }
        else { flavor = "強振したが仕留めきれなかった。"; }
        break;
      case "meet":
        extraRuns = Math.random() < 0.75 ? 1 : 0;
        flavor = extraRuns > 0 ? "手堅いミートで着実に1点を加えた。" : "ミートには成功したが得点には至らなかった。";
        break;
      case "bunt":
        extraRuns = Math.random() < 0.7 ? 1 : 0;
        flavor = extraRuns > 0 ? "確実なバントで走者を返した。" : "バントは決めたが得点には結びつかなかった。";
        break;
      case "wait":
        if (Math.random() < 0.4) { extraRuns = 1 + Math.floor(Math.random() * 2); flavor = "じっくり見極めて相手の隙を突き加点した。"; }
        else { flavor = "好機を活かせず、この回は終わった。"; }
        break;
    }
    return { extraRuns, flavor };
  }

  // 守備采配: 投手にどう投げさせるか。相手の実効能力を上下させる(投手の該当能力が高いほど狙いが活きる)
  const PITCHING_APPROACHES = [
    { id: "fastball", label: "直球多用", desc: "球速で押し込む。ハマれば三振の山だが、甘く入ると痛打も" },
    { id: "breaking", label: "変化球多用", desc: "変化球で打者を惑わす。コントロールが鍵" },
    { id: "strikeout", label: "三振狙い", desc: "一つ一つ丁寧に空振りを狙う" },
    { id: "contact", label: "打たせて取る", desc: "スタミナを温存し、守備に頼る安定志向" },
  ];

  // 守備采配の効果は「そのピンチの回」の相手の得点のみ増減させる(試合全体には影響しない)
  function resolvePitchingApproach(approachId, pitcher) {
    const velocity = pitcher ? (pitcher.stats.velocity || 40) : 40;
    const breaking = pitcher ? (pitcher.stats.breaking || 40) : 40;
    const control = pitcher ? (pitcher.stats.control || 40) : 40;
    let reduction = 0; // 正なら相手の得点を減らす、負なら逆に痛打を浴びて増える
    let flavor = "";
    switch (approachId) {
      case "fastball": {
        const scale = Math.max(0.5, Math.min(1.5, velocity / 60));
        if (Math.random() < 0.5 * scale) { reduction = 2 + Math.floor(Math.random() * 2); flavor = "力強い直球でピンチを断ち切った。"; }
        else { reduction = -(1 + Math.floor(Math.random() * 2)); flavor = "直球を狙い打たれ、痛打を浴びてしまった。"; }
        break;
      }
      case "breaking": {
        const scale = Math.max(0.5, Math.min(1.5, breaking / 60));
        reduction = Math.random() < 0.55 * scale ? (1 + Math.floor(Math.random() * 2)) : 0;
        flavor = reduction > 0 ? "切れ味鋭い変化球で打ち取った。" : "変化球を見極められてしまった。";
        break;
      }
      case "strikeout": {
        const scale = Math.max(0.5, Math.min(1.5, control / 60));
        if (Math.random() < 0.45 * scale) { reduction = 2 + Math.floor(Math.random() * 2); flavor = "三振の山を築き、危機を脱した。"; }
        else { reduction = -(1 + Math.floor(Math.random() * 2)); flavor = "力んで制球を乱し、走者を溜めてしまった。"; }
        break;
      }
      case "contact":
        reduction = Math.random() < 0.8 ? 1 : 0;
        flavor = reduction > 0 ? "堅実な投球と守備でピンチをしのいだ。" : "打たせて取る作戦だったが打球が抜けた。";
        break;
    }
    return { reduction, flavor };
  }

  function averageBattingPower() {
    const ids = lineup.battingOrder.filter(Boolean);
    if (ids.length === 0) return 40;
    const vals = ids.map(id => players.find(p => p.id === id)).filter(Boolean).map(p => p.stats.batting || 0);
    if (vals.length === 0) return 40;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }

  // 試合の基礎となる自チーム・相手の力を計算する(実力どおりの、采配が入る前の下地)
  function computeBaseMatchNumbers(roundInfo, presetOpponent) {
    const teamPower = totalLineupPower() * mentalStrengthBonus(roundInfo);

    // 大会の試合は、序盤は格下寄り・勝ち進むほど格上と当たりやすくなるように相手の強さの範囲を変える
    // (roundInfoがない練習試合は、これまで通り70%〜130%の範囲)
    let low = 0.7;
    let high = 1.3;
    if (roundInfo && roundInfo.roundsToWin > 1) {
      const progress = (roundInfo.roundNumber - 1) / (roundInfo.roundsToWin - 1); // 0(1回戦)〜1(決勝)
      low = 0.5 + progress * 0.4;   // 0.5 → 0.9
      high = 0.9 + progress * 0.7;  // 0.9 → 1.6
    }
    const opponentPower = Math.round(teamPower * (low + Math.random() * (high - low)));
    const opponentSchool = presetOpponent || pickRivalSchool();
    const winProbability = teamPower / (teamPower + opponentPower);
    return { teamPower, opponentPower, opponentSchool, winProbability };
  }

  const INNING_COUNT = 9;

  // 実力差が大きいほど、その回の得点が多く出やすくなる(実力伯仲なら0〜1点、大差なら2〜4点も出やすい)
  function randomInningRuns(rate) {
    const raw = Math.random() * rate * 2;
    return Math.min(4, Math.round(raw));
  }

  // 実力(winProbability)をもとに、9イニング分の素点をシミュレートする(采配はまだ加えていない状態)
  function simulateInnings(winProbability) {
    const teamRate = 0.5 + winProbability * 1.3;       // 劣勢なら0.5前後、優勢なら1.8前後
    const oppRate = 0.5 + (1 - winProbability) * 1.3;

    const teamRuns = [];
    const oppRuns = [];
    for (let i = 0; i < INNING_COUNT; i++) {
      teamRuns.push(randomInningRuns(teamRate));
      oppRuns.push(randomInningRuns(oppRate));
    }
    return { teamRuns, oppRuns };
  }

  // 攻撃のチャンス・守備のピンチとなる回を、中盤〜終盤からランダムに2つ選ぶ(重複しない)
  function pickChanceAndPinchInnings() {
    const pool = [3, 4, 5, 6, 7, 8];
    const chanceInning = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const pinchInning = pool[Math.floor(Math.random() * pool.length)];
    return { chanceInning, pinchInning };
  }

  // 得点が同点の場合は、実力どおりの確率でどちらかに決勝点を与える
  function breakTieIfNeeded(teamRuns, oppRuns, winProbability) {
    let teamTotal = teamRuns.reduce((a, b) => a + b, 0);
    let oppTotal = oppRuns.reduce((a, b) => a + b, 0);
    if (teamTotal === oppTotal) {
      if (Math.random() < winProbability) teamRuns[INNING_COUNT - 1] += 1;
      else oppRuns[INNING_COUNT - 1] += 1;
      teamTotal = teamRuns.reduce((a, b) => a + b, 0);
      oppTotal = oppRuns.reduce((a, b) => a + b, 0);
    }
    return { teamTotal, oppTotal };
  }

  // 試合結果の共通の仕上げ(勝敗の確定・対戦成績の記録・強さの表示など)
  function finishMatch(base, teamRuns, oppRuns) {
    const { teamTotal, oppTotal } = breakTieIfNeeded(teamRuns, oppRuns, base.winProbability);
    const isWin = teamTotal > oppTotal;
    const starters = getStartingPlayers();
    const count = starters.length || 1;
    const teamTier = powerTierLabel(base.teamPower / count);
    const opponentTier = powerTierLabel(base.opponentPower / count);
    recordRivalResult(base.opponentSchool.name, isWin);
    return {
      teamRuns, oppRuns, teamTotal, oppTotal, isWin,
      teamTier, opponentTier, opponentSchool: base.opponentSchool,
    };
  }

  // 練習試合など、采配なしでそのまま結果を出したいときに使う
  function runAutoMatch(roundInfo) {
    const base = computeBaseMatchNumbers(roundInfo);
    const { teamRuns, oppRuns } = simulateInnings(base.winProbability);
    return finishMatch(base, teamRuns, oppRuns);
  }

  function buildCommentary(box, isWin, opponentName) {
    const lines = [];
    const teamBestInning = box.teamRuns.indexOf(Math.max(...box.teamRuns));
    if (box.teamRuns[teamBestInning] >= 2) {
      lines.push(`${teamBestInning + 1}回、自チームが${box.teamRuns[teamBestInning]}点を奪う猛攻を見せた。`);
    }
    const oppBestInning = box.oppRuns.indexOf(Math.max(...box.oppRuns));
    if (box.oppRuns[oppBestInning] >= 2) {
      lines.push(`${oppBestInning + 1}回、${opponentName}に${box.oppRuns[oppBestInning]}点を奪われる場面もあった。`);
    }

    const diff = Math.abs(box.teamTotal - box.oppTotal);
    if (diff <= 1) {
      lines.push(isWin ? "最後まで分からない大接戦を制した!" : "僅差の勝負を落としてしまった…");
    } else if (diff >= 5) {
      lines.push(isWin ? "力の差を見せつける完勝だった。" : "力の差を見せつけられる完敗だった…");
    } else {
      lines.push(isWin ? "着実に得点を重ねて勝利した。" : "反撃及ばず敗れた。");
    }
    return lines;
  }

  function buildMatchReportHtml(label, result, tacticsFlavors) {
    const school = result.opponentSchool;
    const commentary = [...(tacticsFlavors || []), ...buildCommentary(result, result.isWin, school.name)];
    const inningHeaders = result.teamRuns.map((_, i) => `<th>${i + 1}</th>`).join("") + "<th>計</th>";
    const teamRow = result.teamRuns.map(r => `<td>${r}</td>`).join("") + `<td><strong>${result.teamTotal}</strong></td>`;
    const oppRow = result.oppRuns.map(r => `<td>${r}</td>`).join("") + `<td><strong>${result.oppTotal}</strong></td>`;
    const outcomeText = result.isWin ? "🎉 勝利!" : "😢 敗北…";
    const record = rivalRecords[school.name] || { wins: 0, losses: 0 };
    const mvp = pickMatchMvp(result.isWin);
    const mvpLine = mvp ? `<div class="mvp-line">🌟 この試合のMVP: ${mvp.name}(${positionLabels[mvp.position]})</div>` : "";

    return `
      <div class="match-outcome ${result.isWin ? "win" : "lose"}">${label}: ${outcomeText}</div>
      <div class="opponent-line">対戦校: ${school.name}(${school.trait})</div>
      <div class="box-score-wrap">
        <table class="box-score">
          <tr><th></th>${inningHeaders}</tr>
          <tr><th>自チーム</th>${teamRow}</tr>
          <tr><th>${school.name}</th>${oppRow}</tr>
        </table>
      </div>
      <div class="commentary-lines">${commentary.map(line => `<div>${line}</div>`).join("")}</div>
      ${mvpLine}
      <div class="match-power-line">自チーム: ${result.teamTier} / ${school.name}: ${result.opponentTier}(通算 ${record.wins}勝${record.losses}敗)</div>
    `;
  }

  // 試合に勝った時、出場選手の中で一番能力の高い選手をMVPとして讃える(③ 育成の手応え強化)
  function pickMatchMvp(isWin) {
    if (!isWin) return null;
    const starters = getStartingPlayers();
    if (starters.length === 0) return null;
    return [...starters].sort((a, b) => playerPowerSum(b) - playerPowerSum(a))[0];
  }

  // 試合を経験することで、出場した(スタメンの)選手だけ能力が少しずつ伸びる(その分、疲労も少し溜まる)
  function grantMatchExperience() {
    getStartingPlayers().forEach(player => {
      const personality = getPersonality(player);
      const defs = statDefs[player.position];
      const def = defs[Math.floor(Math.random() * defs.length)];
      let gain = 1 + Math.floor(Math.random() * 2); // 1〜2ポイント上がる
      if (personality && personality.id === "hard-worker") gain = Math.round(gain * 1.3);
      if (personality && personality.id === "late-bloomer") {
        const grade = schoolYear - player.enrollYear + 1;
        gain = Math.round(gain * (grade <= 1 ? 0.7 : 1.4));
      }
      player.stats[def.key] = Math.min(STAT_CAP, player.stats[def.key] + gain);

      let fatigueGain = 5 + Math.floor(Math.random() * 6); // 5〜10
      if (personality && personality.id === "durable") fatigueGain = Math.round(fatigueGain * 0.7);
      player.fatigue = Math.min(100, (player.fatigue || 0) + fatigueGain);
    });
  }

  function isMatchPendingThisWeek() {
    const windowT = findWindowTournament();
    return !!windowT && isMatchAvailable(windowT);
  }

  function renderCalendar() {
    const monthIndex = Math.floor(weekIndex / WEEKS_PER_MONTH);
    const weekInMonth = (weekIndex % WEEKS_PER_MONTH) + 1;
    calendarLine.textContent = `${schoolYear}年目 ${monthNames[monthIndex]} 第${weekInMonth}週`;

    const windowT = findWindowTournament();
    if (windowT) {
      ensureTournamentReset(windowT);
      const state = tournamentState[windowT.id];
      if (state.champion) {
        statusLine.textContent = `${windowT.name}で優勝しました!`;
      } else if (state.eliminated) {
        statusLine.textContent = `${windowT.name}で敗退しました。`;
      } else if (windowT.requiresChampion && !isMatchAvailable(windowT)) {
        statusLine.textContent = `${windowT.name}の出場権はありません。`;
      } else {
        statusLine.textContent = `${windowT.name} ${roundLabel(windowT.roundsToWin, state.currentRound + 1)}の期間です。`;
      }
    } else if (seasonEventMessage) {
      statusLine.textContent = seasonEventMessage;
    } else if (weekIndex === 0) {
      statusLine.textContent = "新学期が始まりました。";
    } else if (weekIndex === TOTAL_WEEKS - 1) {
      statusLine.textContent = "学年末です。来週から新学年になります。";
    } else {
      statusLine.textContent = "オフシーズンです。練習に励みましょう。";
    }

    if (windowT && isMatchAvailable(windowT) && !pendingMatch) {
      const state = tournamentState[windowT.id];
      const roundNumber = state.currentRound + 1;
      officialMatchButton.style.display = "block";
      officialMatchButton.textContent = `公式戦: ${windowT.name} ${roundLabel(windowT.roundsToWin, roundNumber)}を行う`;

      if (!state.previewOpponent) state.previewOpponent = pickRivalSchool();
      const stakesText = getStakesText(windowT, roundNumber);
      matchPreviewArea.style.display = "block";
      matchPreviewArea.innerHTML = `
        次の対戦校: <strong>${state.previewOpponent.name}</strong>(${state.previewOpponent.trait})
        <div class="preview-stakes">${stakesText}</div>
      `;
    } else {
      officialMatchButton.style.display = "none";
      if (!pendingMatch) matchPreviewArea.style.display = "none";
    }

    updateNextWeekButtonState();
  }

  function canAdvanceWeek() {
    // 采配中、または今週の公式戦がまだ残っていれば次の週へ進めない(練習は必須にしない)
    if (pendingMatch) return false;
    return !isMatchPendingThisWeek();
  }

  function updateNextWeekButtonState() {
    nextWeekButton.disabled = !canAdvanceWeek();
  }

  // 公式戦は「攻撃采配→守備采配→結果」の2段階で進む。ここで試合を始め、まず攻撃采配を尋ねる
  // 公式戦は9イニングをまず素点でシミュレートし、その中の「チャンスの回」「ピンチの回」でだけ
  // 采配を挟む。采配の効果はその回の得点にだけ効き、それ以外のイニングには影響しない
  officialMatchButton.addEventListener("click", () => {
    if (!lineup.pitcherId) {
      alert("スタメンに投手がいません。「スタメン・守備・打順」で先発投手を選んでください。");
      return;
    }
    const windowT = findWindowTournament();
    if (!windowT || !isMatchAvailable(windowT)) return;

    const state = tournamentState[windowT.id];
    const roundNumber = state.currentRound + 1;
    const label = roundLabel(windowT.roundsToWin, roundNumber);
    const base = computeBaseMatchNumbers({ roundNumber, roundsToWin: windowT.roundsToWin }, state.previewOpponent);
    const { teamRuns, oppRuns } = simulateInnings(base.winProbability);
    const { chanceInning, pinchInning } = pickChanceAndPinchInnings();

    pendingMatch = {
      windowT, state, roundNumber, label, base,
      teamRuns, oppRuns, chanceInning, pinchInning,
      phase: "batting", battingFlavor: "",
    };

    officialMatchButton.style.display = "none";
    matchPreviewArea.style.display = "none";
    officialMatchResult.innerHTML = "";
    renderTacticsUI();
    updateNextWeekButtonState();
  });

  function renderTacticsUI() {
    tacticsCard.style.display = "block";
    if (pendingMatch.phase === "batting") {
      tacticsPrompt.textContent = `${pendingMatch.chanceInning + 1}回、チャンスの場面。どう攻める?`;
      tacticsOptions.innerHTML = BATTING_APPROACHES
        .map(a => `<button class="tactics-button" data-approach="${a.id}" title="${a.desc}">${a.label}</button>`)
        .join("");
    } else {
      tacticsPrompt.textContent = `${pendingMatch.pinchInning + 1}回、ピンチの場面。どう抑える?`;
      tacticsOptions.innerHTML = PITCHING_APPROACHES
        .map(a => `<button class="tactics-button" data-approach="${a.id}" title="${a.desc}">${a.label}</button>`)
        .join("");
    }
  }

  tacticsOptions.addEventListener("click", (event) => {
    const approachId = event.target.dataset.approach;
    if (!approachId || !pendingMatch) return;

    if (pendingMatch.phase === "batting") {
      const { extraRuns, flavor } = resolveBattingApproach(approachId, averageBattingPower());
      pendingMatch.teamRuns[pendingMatch.chanceInning] += extraRuns;
      pendingMatch.battingFlavor = `【${pendingMatch.chanceInning + 1}回・攻撃采配:${BATTING_APPROACHES.find(a => a.id === approachId).label}】${flavor}`;
      pendingMatch.phase = "pitching";
      renderTacticsUI();
      return;
    }

    // 守備采配が決まったら、その回の相手の得点を増減させたうえで試合を確定する
    const { windowT, state, roundNumber, label, base, teamRuns, oppRuns, pinchInning, battingFlavor } = pendingMatch;
    const pitcher = players.find(p => p.id === lineup.pitcherId);
    const { reduction, flavor: pitchingFlavor } = resolvePitchingApproach(approachId, pitcher);
    oppRuns[pinchInning] = Math.max(0, oppRuns[pinchInning] - reduction);

    const result = finishMatch(base, teamRuns, oppRuns);

    if (result.isWin) {
      state.currentRound++;
      if (state.currentRound >= windowT.roundsToWin) {
        state.champion = true;
        const cheerText = windowT.id === "summer" ? "夏の甲子園出場を決めた!" : `${windowT.name}を制した!`;
        addNewsEntry(`🏆 部史に残る快挙!${cheerText}`);
      }
    } else {
      state.eliminated = true;
    }
    state.previewOpponent = null;
    officialMatchPlayedThisWeek = true;
    grantMatchExperience();

    let reportLabel = `${windowT.name} ${label}`;
    if (result.isWin && state.champion) {
      reportLabel += `(優勝!)`;
    }
    const pitchingFlavorLine = `【${pinchInning + 1}回・守備采配:${PITCHING_APPROACHES.find(a => a.id === approachId).label}】${pitchingFlavor}`;
    officialMatchResult.innerHTML = buildMatchReportHtml(reportLabel, result, [battingFlavor, pitchingFlavorLine]);

    pendingMatch = null;
    tacticsCard.style.display = "none";

    renderCalendar();
    renderPlayerList();
  });

  nextWeekButton.addEventListener("click", () => {
    if (!canAdvanceWeek()) return;

    // まだ今週の練習を実行していない選手には、選んでいる練習メニューを自動で適用してから週を進める
    players.forEach(p => {
      if (!p.practicedThisWeek) applyPracticeGain(p, p.selectedPracticeStatKey);
    });

    const previousWeekIndex = weekIndex;
    weekIndex++;
    seasonEventMessage = "";
    if (weekIndex >= TOTAL_WEEKS) {
      weekIndex = 0;
      schoolYear++;
    }

    if (previousWeekIndex === 0 && weekIndex === 1) {
      // 4月2週目に入学式・スカウトが始まる
      processGraduationAndScout();
      seasonEventMessage = "入学式が行われました。下のスカウト欄から新入部員を選びましょう。";
    } else if (previousWeekIndex === 1 && weekIndex === 2) {
      // スカウトの検討期間はその週だけ。決めなかった候補はいなくなる(投手が0人ならここで確保する)
      scoutCandidates = [];
      ensurePitcherExists();
    }

    officialMatchPlayedThisWeek = false;
    officialMatchResult.textContent = "";
    players.forEach(p => {
      p.practicedThisWeek = false;
      if (p.injuryWeeksLeft > 0) {
        p.injuryWeeksLeft--;
        p.fatigue = Math.max(0, (p.fatigue || 0) - 15); // 療養中は疲労も回復していく
      }
    });

    validateLineup();

    const windowT = findWindowTournament();
    if (!windowT && lineup.pitcherId && Math.random() < 0.25) {
      const result = runAutoMatch();
      grantMatchExperience();
      practiceGameResult.innerHTML = buildMatchReportHtml("練習試合", result);
    } else {
      practiceGameResult.innerHTML = "";
    }

    // オフシーズンの週には、まれに小さな出来事が起こる
    seasonEventResult.textContent = !windowT ? maybeTriggerRandomEvent() : "";

    renderCalendar();
    renderScoutCandidates();
    renderPlayerList();
  });

  function renderPlayerList() {
    validateLineup();
    checkPlayerRankMilestones();
    renderLineupControls();
    renderBulkPracticeControls();
    renderRivalRecords();
    renderNewsFeed();
    playerListArea.innerHTML = "";
    emptyListNote.style.display = players.length === 0 ? "block" : "none";
    teamPowerLine.textContent = players.length > 0 ? `チームの実力: ${currentTeamTierLabel()}` : "";

    const matchPending = isMatchPendingThisWeek();
    tournamentWeekNote.style.display = (matchPending && players.length > 0) ? "block" : "none";

    players.forEach((player, index) => {
      const div = document.createElement("div");
      div.className = "player";

      const positionLabel = positionLabels[player.position];
      const gradeLabel = playerGradeLabel(player);

      const statLine = statDefs[player.position]
        .map(def => `${def.label}: ${player.stats[def.key]}`)
        .join(" / ");

      const talentBadge = player.talentLabel
        ? `<span class="talent-badge">★ ${player.talentLabel}の才能</span>`
        : "";

      const injured = player.injuryWeeksLeft > 0;
      const injuryBadge = injured
        ? `<span class="injury-badge">🤕 故障中(あと${player.injuryWeeksLeft}週)</span>`
        : "";

      const personality = getPersonality(player);
      const personalityBadge = personality
        ? `<span class="personality-badge" title="${personality.desc}">${personality.label}</span>`
        : "";

      const fatigue = player.fatigue || 0;
      let fatigueClass = "fatigue-ok";
      if (fatigue >= INJURY_RISK_FATIGUE) fatigueClass = "fatigue-danger";
      else if (fatigue >= 40) fatigueClass = "fatigue-warn";

      const menuOptions = practiceMenus[player.position]
        .map(menu => `<option value="${menu.statKey}" ${menu.statKey === player.selectedPracticeStatKey ? "selected" : ""}>${menu.label}</option>`)
        .join("");

      const disablePractice = matchPending || player.practicedThisWeek || injured;
      const buttonDisabled = disablePractice ? "disabled" : "";
      let buttonLabel = "この内容で練習する";
      if (injured) buttonLabel = "故障中は練習できません";
      else if (matchPending) buttonLabel = "今週は公式戦のため練習できません";
      else if (player.practicedThisWeek) buttonLabel = "今週は練習済み";

      div.innerHTML = `
        <span class="player-name">${player.name}</span>
        <span class="player-pos">${positionLabel}</span>
        <span class="player-grade">${gradeLabel}</span>
        <span class="rank-badge">${playerRankLabel(player)}</span>
        ${talentBadge}
        ${personalityBadge}
        ${injuryBadge}
        <div class="stat-line">${statLine}</div>
        <div class="fatigue-line ${fatigueClass}">疲労: ${fatigue}</div>
        <div class="practice-row">
          <select class="practice-select" data-index="${index}" ${buttonDisabled}>${menuOptions}</select>
          <button class="practice-execute-button" data-index="${index}" ${buttonDisabled}>${buttonLabel}</button>
        </div>
      `;
      playerListArea.appendChild(div);
    });

    updateNextWeekButtonState();
    saveGame();
  }

  // 疲労がこの値を超えると、練習のたびに怪我のリスクが発生する
  const INJURY_RISK_FATIGUE = 70;

  function applyPracticeGain(player, statKey) {
    if (player.injuryWeeksLeft > 0) return; // 故障中は練習できない

    if (statKey === "rest") {
      // 休養: 能力は伸びないが疲労が大きく回復する
      player.fatigue = Math.max(0, (player.fatigue || 0) - (25 + Math.floor(Math.random() * 11)));
      return;
    }

    const personality = getPersonality(player);

    let gain = 1 + Math.floor(Math.random() * 3); // 1〜3ポイント上がる
    if (personality && personality.id === "hard-worker") gain = Math.round(gain * 1.3); // 練習の虫: 伸びが良い
    if (personality && personality.id === "late-bloomer") {
      // 大器晩成: 1年生のうちは伸びが鈍いが、2年生以降は伸びが良くなる
      const grade = schoolYear - player.enrollYear + 1;
      gain = Math.round(gain * (grade <= 1 ? 0.7 : 1.4));
    }
    player.stats[statKey] = Math.min(STAT_CAP, player.stats[statKey] + gain);

    let fatigueGain = 15 + Math.floor(Math.random() * 11); // 15〜25 疲労が溜まる
    if (personality && personality.id === "durable") fatigueGain = Math.round(fatigueGain * 0.7); // 丈夫: 疲労が溜まりにくい
    player.fatigue = Math.min(100, (player.fatigue || 0) + fatigueGain);

    if (player.fatigue >= INJURY_RISK_FATIGUE) {
      let injuryChance = 0.05 + (player.fatigue - INJURY_RISK_FATIGUE) * 0.01; // 疲労70で5%、100で35%
      if (personality && personality.id === "injury-prone") injuryChance *= 1.5; // 怪我しやすい
      if (Math.random() < injuryChance) {
        player.injuryWeeksLeft = 1 + Math.floor(Math.random() * 3); // 1〜3週間離脱
        player.fatigue = Math.max(0, player.fatigue - 30);
      }
    }
  }

  function practicePlayer(index, statKey) {
    const player = players[index];
    if (player.practicedThisWeek || isMatchPendingThisWeek() || player.injuryWeeksLeft > 0) return;
    player.selectedPracticeStatKey = statKey;
    applyPracticeGain(player, statKey);
    player.practicedThisWeek = true;
    renderPlayerList();
  }

  playerListArea.addEventListener("click", (event) => {
    if (event.target.classList.contains("practice-execute-button")) {
      const index = Number(event.target.dataset.index);
      const select = playerListArea.querySelector(`.practice-select[data-index="${index}"]`);
      practicePlayer(index, select.value);
    }
  });

  playerListArea.addEventListener("change", (event) => {
    if (event.target.classList.contains("practice-select")) {
      const index = Number(event.target.dataset.index);
      players[index].selectedPracticeStatKey = event.target.value;
    }
  });

  const bulkPracticeArea = document.getElementById("bulk-practice-controls");
  const bulkSelectionByPosition = {};

  function renderBulkPracticeControls() {
    bulkPracticeArea.innerHTML = "";
    const positionsPresent = allPositions.filter(position => players.some(p => p.position === position));
    if (positionsPresent.length === 0) return;

    positionsPresent.forEach(position => {
      const currentChoice = bulkSelectionByPosition[position] || practiceMenus[position][0].statKey;
      const options = practiceMenus[position]
        .map(menu => `<option value="${menu.statKey}" ${menu.statKey === currentChoice ? "selected" : ""}>${menu.label}</option>`)
        .join("");
      const row = document.createElement("div");
      row.className = "bulk-row";
      row.innerHTML = `
        <span class="bulk-label">${positionLabels[position]}</span>
        <select class="bulk-select" data-position="${position}">${options}</select>
        <button class="bulk-apply-button" data-position="${position}">全員に反映</button>
      `;
      bulkPracticeArea.appendChild(row);
    });
  }

  bulkPracticeArea.addEventListener("change", (event) => {
    if (!event.target.classList.contains("bulk-select")) return;
    bulkSelectionByPosition[event.target.dataset.position] = event.target.value;
  });

  bulkPracticeArea.addEventListener("click", (event) => {
    if (!event.target.classList.contains("bulk-apply-button")) return;
    const position = event.target.dataset.position;
    const select = bulkPracticeArea.querySelector(`.bulk-select[data-position="${position}"]`);
    const statKey = select.value;
    bulkSelectionByPosition[position] = statKey;
    players.forEach(player => {
      if (player.position === position) player.selectedPracticeStatKey = statKey;
    });
    renderPlayerList();
  });

  if (!loadGame()) {
    generateInitialRoster();
    ensurePitcherExists();
    autoOptimizeLineup(); // 最初だけ、分かりやすいようにスタメンを自動で組んでおく
  }

  renderCalendar();
  renderScoutCandidates();
  renderPlayerList();
</script>

</body>
